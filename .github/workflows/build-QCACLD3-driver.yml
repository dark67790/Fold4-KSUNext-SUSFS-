name: Build Fold4 Kernel (KSU-Next + SUSFS) — Personal

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      qcacld3_only:
        description: "Fast mode: skip the ~40 min kernel build and only build QCACLD3 (~10 min)"
        type: boolean
        default: false

jobs:
  build:
    name: SM-F936B · KSU-Next · SUSFS v2.1.0 · Droidspaces · NoMount · QCACLD3
    runs-on: ubuntu-latest

    steps:
    # ── 1. Checkout ────────────────────────────────────────────────────────────
    - name: Checkout
      uses: actions/checkout@v4

    # ── 2. Free disk space ─────────────────────────────────────────────────────
    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: >
          azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable
          firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*
        remove_packages_one_command: true
        remove_folders: >
          /usr/share/swift /usr/share/miniconda /usr/share/az*
          /usr/local/lib/node_modules /usr/local/share/chromium
          /usr/local/share/powershell /usr/local/julia
          /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle
        rm_cmd: rmz
        rmz_version: "3.1.1"
        testing: false

    # ── 3. Swap ────────────────────────────────────────────────────────────────
    - name: Setup Swap
      run: |
        sudo fallocate -l 12G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    # ── 4. Dependencies ────────────────────────────────────────────────────────
    - name: Install Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          bc bison flex libssl-dev libelf-dev \
          python3-pip unzip git patch coreutils curl perl \
          build-essential cpio wget zip

    # ── 5. Samsung source + toolchain ──────────────────────────────────────────
    - name: Download and Extract Samsung Source
      env:
        SRC_ID: "1bdcORqw9c05eGFMFo6nCrfgwcHXDiMN7"   # copy of SM-F936N_KOR_14_Opensource.zip
        TC_ID: "1alFYynwVbV5YH6DZf30jmi0tHSZ2EmPw"    # copy of toolchain.tar.gz
      run: |
        pip install -q -U gdown

        dl() {
          local id="$1" out="$2"
          for i in 1 2 3; do
            gdown "$id" -O "$out" && return 0
            echo "⚠️ gdown attempt $i failed for $out, retrying in 60s..."
            sleep 60
          done
          echo "❌ Failed to download $out after 3 attempts"
          return 1
        }

        dl "$SRC_ID" samsung.zip
        dl "$TC_ID" toolchain.tar.gz

        unzip -q samsung.zip
        tar -xf Kernel.tar.gz
        tar -xf Platform.tar.gz
        rm samsung.zip Kernel.tar.gz Platform.tar.gz
        tar -xzf toolchain.tar.gz -C kernel_platform/
        rm toolchain.tar.gz

    # ── 5b. DEBUG: where is the wlan source? ───────────────────────────────────
    # Runs right after extraction so we know BEFORE the 1h+ build whether
    # QCACLD3 is in the Samsung source and what its layout looks like.
    - name: "DEBUG: Locate QCACLD3 source"
      run: |
        set +e   # a failing ls/grep below must not abort the report
        mkdir -p "$GITHUB_WORKSPACE/debug"
        {
          echo "=== top-level workspace ==="
          ls -la "$GITHUB_WORKSPACE"
          echo
          echo "=== vendor/qcom/opensource (workspace root) ==="
          ls -la "$GITHUB_WORKSPACE/vendor/qcom/opensource" 2>&1 || true
          echo
          echo "=== every qcacld-3.0 / cnss2 / qca-wifi-host-cmn / fw-api dir ==="
          find "$GITHUB_WORKSPACE" \( -type d -name 'qcacld-3.0' -o -type d -name 'cnss2' \
            -o -type d -name 'qca-wifi-host-cmn' -o -type d -name 'fw-api' \) \
            -not -path '*/.git/*' 2>/dev/null
          echo
          echo "=== wlan dir contents ==="
          for d in $(find "$GITHUB_WORKSPACE" -type d -path '*opensource/wlan' -not -path '*/.git/*' 2>/dev/null); do
            echo "--- $d"; ls -la "$d"
          done
          echo
          echo "=== qcacld-3.0 Kbuild / Kconfig / Makefile / configs ==="
          Q=$(find "$GITHUB_WORKSPACE" -type d -name 'qcacld-3.0' -not -path '*/.git/*' | head -1)
          if [ -n "$Q" ]; then
            ls -la "$Q"
            echo "--- configs:"; ls "$Q/configs" 2>&1 | head -60
            echo "--- Kbuild head:"; head -80 "$Q/Kbuild" 2>&1
            echo "--- Android.mk / BUILD / *.bzl:"; ls "$Q"/Android.mk "$Q"/BUILD* "$Q"/*.bzl 2>&1
            echo "--- waipio / kalama / qca6490 mentions in configs:"
            grep -rIl -i -E 'waipio|qca6490|wcn6855' "$Q/configs" 2>/dev/null | head -20
          else
            echo "❌ qcacld-3.0 NOT FOUND anywhere in the Samsung source"
          fi
          echo
          echo "=== Samsung build script: does it already build wlan? ==="
          grep -n -i -E 'wlan|qca|cnss|vendor/qcom' "$GITHUB_WORKSPACE/build_kernel_GKI.sh" 2>&1 | head -40
          echo
          echo "=== build.config / defconfig hints for wlan ==="
          grep -rn -i -E 'qca_cld|cnss|wlan' "$GITHUB_WORKSPACE"/kernel_platform/common/arch/arm64/configs/*.config 2>/dev/null | head -30
          grep -rn -i -E 'qca_cld|cnss|wlan' "$GITHUB_WORKSPACE/kernel_platform/common/arch/arm64/configs/gki_defconfig" 2>/dev/null | head -30
        } 2>&1 | tee "$GITHUB_WORKSPACE/debug/00-wlan-source.txt"

    # ── 6. Patch build target ──────────────────────────────────────────────────
    - name: Patch Build Target
      run: |
        sed -i 's/BUILD_TARGET=q4q_kor_singlex/BUILD_TARGET=q4q_eur_openx/g' \
          build_kernel_GKI.sh

    # ── 7. Environment variables ───────────────────────────────────────────────
    - name: Set Environment Variables
      run: |
        echo "COMMON=$GITHUB_WORKSPACE/kernel_platform/common" >> $GITHUB_ENV
        echo "GKI_DEFCONFIG=$GITHUB_WORKSPACE/kernel_platform/common/arch/arm64/configs/gki_defconfig" >> $GITHUB_ENV
        echo "PATCHES=$GITHUB_WORKSPACE/patches" >> $GITHUB_ENV

    # ── 8. SUSFS kernel patches ────────────────────────────────────────────────
    - name: Setup SUSFS Kernel Patches
      working-directory: kernel_platform/common
      run: |
        cp $PATCHES/susfs/fs/susfs.c fs/
        cp $PATCHES/susfs/include/susfs.h include/linux/susfs.h
        cp $PATCHES/susfs/include/susfs_def.h include/linux/susfs_def.h

        sed -i '/#ifdef CONFIG_SECURITY_DEFEX/,/^#endif/d' fs/open.c

        sed -i '/copy_flags = CL_COPY_UNBINDABLE | CL_EXPIRE;/,/#endif/ {
          /#ifdef CONFIG_KDP_NS/,/#endif/ {
             /#else/,/#endif/!d
             /#else/d
             /#endif/d
          }
        }' fs/namespace.c

        patch -p1 < $PATCHES/susfs/50_add_susfs_in_gki-android12-5.10.patch || true
        patch -p1 < $PATCHES/susfs/base.c.patch || true

        python3 $PATCHES/susfs_hunk_fix.py

        find . -name "*.rej" -delete
        find . -name "*.orig" -delete

    # ── 9. Verify SUSFS kernel patches ─────────────────────────────────────────
    - name: Verify SUSFS Kernel Patches
      working-directory: kernel_platform/common
      run: |
        FAIL=0
        check() {
          local label="$1" file="$2" pattern="$3"
          grep -q "$pattern" "$file" 2>/dev/null \
            && echo "✅ $label" \
            || { echo "❌ $label — '$pattern' not found in $file"; FAIL=1; }
        }

        check "susfs.c exists"             fs/susfs.c                   "susfs"
        check "susfs.h exists"             include/linux/susfs.h        "susfs"
        check "susfs_def.h exists"         include/linux/susfs_def.h    "susfs"
        check "fs/Makefile compiles susfs" fs/Makefile                  "susfs.o"
        check "exec.c patched"             fs/exec.c                    "susfs_def.h"
        check "namespace.c SUS_MOUNT"      fs/namespace.c               "CONFIG_KSU_SUSFS_SUS_MOUNT"
        check "namespace.c externs"        fs/namespace.c               "susfs_is_current_ksu_domain"
        check "namespace.c copy_flags"     fs/namespace.c               "CL_COPY_MNT_NS"
        check "open.c patched"             fs/open.c                    "is_inode_open_redirect"
        check "proc/base.c include"        fs/proc/base.c               "susfs_def.h"
        check "proc/base.c SUS_MAP"        fs/proc/base.c               "AS_FLAGS_SUS_MAP"
        check "proc/base.c vma declared"   fs/proc/base.c               "struct vm_area_struct \*vma"
        check "fdinfo.c patched"           fs/notify/fdinfo.c           "DEFAULT_KSU_MNT_ID"
        check "hooks.c ksu_selinux ref"    security/selinux/hooks.c     "ksu_selinux_hide_running"

        REJS=$(find . -name "*.rej" 2>/dev/null)
        [ -n "$REJS" ] && { echo "❌ Leftover .rej files: $REJS"; FAIL=1; } \
                       || echo "✅ No leftover .rej files"

        [ "$FAIL" -ne 0 ] && { echo "❌ SUSFS kernel patch checks failed — aborting"; exit 1; }
        echo "✅ All SUSFS kernel patch checks passed"

    # ── 10. KernelSU-Next + SUSFS driver patches ───────────────────────────────
    - name: Setup KernelSU-Next with SUSFS
      working-directory: kernel_platform/common
      run: |
        chmod -R u+w .
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
          | bash -s dev

        git -C KernelSU-Next fetch --unshallow 2>/dev/null || true
        git -C KernelSU-Next checkout 551ad80473f60e052917aec08abf5323b6ab2f7c

        cd KernelSU-Next
        patch -p1 --batch < $PATCHES/ksu-next/10_enable_susfs_for_ksu.patch || true

        for p in fix_Kbuild fix_Makefile fix_init.c fix_kernel_umount.c \
                  fix_setuid_hook.c fix_sucompat.c fix_sucompat.h \
                  fix_supercall.c ksu_toolkit overwrite_hook_mode; do
          patch -p1 --batch < $PATCHES/ksu-next/${p}.patch || true
        done

        cd $GITHUB_WORKSPACE/kernel_platform/common/drivers/kernelsu
        python3 $PATCHES/ksun_init_fix.py

        find . -name "*.rej" -delete
        find . -name "*.orig" -delete

    # ── 11. Verify KSU-Next SUSFS integration ──────────────────────────────────
    - name: Verify KernelSU-Next SUSFS Integration
      working-directory: kernel_platform/common/drivers/kernelsu
      run: |
        FAIL=0
        check() {
          local label="$1" file="$2" pattern="$3"
          grep -q "$pattern" "$file" 2>/dev/null \
            && echo "✅ $label" \
            || { echo "❌ $label — '$pattern' not found in $file"; FAIL=1; }
        }

        check "Kconfig has KSU_SUSFS"      Kconfig                      "KSU_SUSFS"
        check "Kconfig has SUS_MOUNT"      Kconfig                      "KSU_SUSFS_SUS_MOUNT"
        check "Kconfig has OPEN_REDIRECT"  Kconfig                      "KSU_SUSFS_OPEN_REDIRECT"
        check "sucompat.c patched"         feature/sucompat.c           "susfs"
        check "selinux hide defined"       selinux/selinux.c            "ksu_selinux_hide_running"
        check "fake_state defined"         selinux/selinux.c            "fake_state"
        check "static keys defined"        runtime/ksud_integration.c   "DEFINE_STATIC_KEY_TRUE"
        check "su_compat_enabled defined"  feature/sucompat.c           "ksu_su_compat_enabled"
        check "supercall syscalls.h"       supercall/supercall.c        "linux/syscalls.h"

        REJS=$(find . -name "*.rej" 2>/dev/null)
        [ -n "$REJS" ] && { echo "❌ Leftover .rej files:"; echo "$REJS"; FAIL=1; } \
                       || echo "✅ No leftover .rej files"

        grep -q "ksu_late_loaded" core/init.c 2>/dev/null \
          && { echo "❌ init.c still has ksu_late_loaded"; FAIL=1; } \
          || echo "✅ init.c clean"

        [ "$FAIL" -ne 0 ] && { echo "❌ KSU-Next SUSFS checks failed — aborting"; exit 1; }
        echo "✅ All KSU-Next SUSFS checks passed"

    # ── 11b. NoMount ───────────────────────────────────────────────────────────
    - name: Add NoMount
      working-directory: kernel_platform/common
      run: |
        curl -LSs https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -
        ./scripts/config --file "$GKI_DEFCONFIG" --enable CONFIG_NOMOUNT

        grep -rqi "nomount" fs/ include/ 2>/dev/null \
          && echo "✅ nomount present" \
          || { echo "❌ nomount not found in fs/ or include/"; exit 1; }
        find . -name "*.rej" -print

    # ── 12. Kernel config ──────────────────────────────────────────────────────
    - name: Set Kernel Config
      run: |
        sed -i 's/check_defconfig//' kernel_platform/common/build.config.gki

        cat >> "$GKI_DEFCONFIG" << 'EOF'
        # Mountify support
        CONFIG_OVERLAY_FS=y
        CONFIG_TMPFS_XATTR=y
        CONFIG_TMPFS_POSIX_ACL=y
        # Kprobes
        CONFIG_KPROBES=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        # KernelSU-Next
        CONFIG_KSU=y
        CONFIG_KSU_WITH_KPROBES=n
        # SUSFS
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_KSTAT=y
        CONFIG_KSU_SUSFS_SUS_MAP=y
        CONFIG_KSU_SUSFS_TRY_UMOUNT=y
        CONFIG_KSU_SUSFS_SPOOF_UNAME=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
        CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
        CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
        # Disable Samsung security enforcement
        CONFIG_UH=n
        CONFIG_UH_RKP=n
        CONFIG_UH_LKMAUTH=n
        CONFIG_UH_LKM_BLOCK=n
        CONFIG_RKP_CFP_JOPP=n
        CONFIG_RKP_CFP=n
        CONFIG_SECURITY_DEFEX=n
        CONFIG_PROCA=n
        CONFIG_FIVE=n
        CONFIG_RKP=n
        CONFIG_KDP_NS=n
        CONFIG_KDP=n
        EOF

    # ── 13. BBG ────────────────────────────────────────────────────────────────
    - name: Add Baseband Guard
      working-directory: kernel_platform/common
      run: |
        curl -LSs https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash

        cat >> "$GKI_DEFCONFIG" << 'EOF'
        # Baseband Guard
        CONFIG_BBG=y
        EOF

        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' \
          security/Kconfig

        sed -i '/^CONFIG_LSM=/ s/"$/,baseband_guard"/' "$GKI_DEFCONFIG"

    # ── 14. Unicode fix ────────────────────────────────────────────────────────
    - name: Apply Unicode Fix
      working-directory: kernel_platform/common
      run: |
        patch -p1 < $PATCHES/unicode/unicode_bypass_fix_6.1-.patch || true
        find . -name "*.rej" -delete
        find . -name "*.orig" -delete

    # ── 15. Droidspaces ────────────────────────────────────────────────────────
    - name: Apply Droidspaces Support
      working-directory: kernel_platform/common
      run: |
        patch -p1 < $PATCHES/droidspaces/fix_sysvipc_kabi_6_7_8.patch || true
        patch -p1 < $PATCHES/droidspaces/fix_abi_padding_for_posix_mqueue.patch || true

        cat >> "$GKI_DEFCONFIG" << 'EOF'
        # Droidspaces — IPC
        CONFIG_SYSVIPC=y
        CONFIG_POSIX_MQUEUE=y
        # Droidspaces — Namespaces
        CONFIG_IPC_NS=y
        CONFIG_PID_NS=y
        # Droidspaces — HW access
        CONFIG_DEVTMPFS=y
        # Droidspaces — Docker NAT (optional)
        CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
        # Droidspaces — UFW (optional)
        CONFIG_NETFILTER_XT_TARGET_REJECT=y
        CONFIG_NETFILTER_XT_TARGET_LOG=y
        CONFIG_NETFILTER_XT_MATCH_RECENT=y
        # Droidspaces — Fail2Ban (optional)
        CONFIG_IP_SET=y
        CONFIG_IP_SET_HASH_IP=y
        CONFIG_IP_SET_HASH_NET=y
        CONFIG_NETFILTER_XT_SET=y
        EOF

        find . -name "*.rej" -delete
        find . -name "*.orig" -delete

    # ── 16. ntsync ─────────────────────────────────────────────────────────────
    - name: Apply ntsync Support
      working-directory: kernel_platform/common
      run: |
        patch -p1 < $PATCHES/ntsync/ntsync_base.patch || true
        patch -p1 < $PATCHES/ntsync/ntsync_compat_android12-5.10.patch || true
        python3 $PATCHES/ntsync_lockdep_fix.py
        find . -name "*.rej" -delete
        find . -name "*.orig" -delete

        cat >> "$GKI_DEFCONFIG" << 'EOF'
        # ntsync
        CONFIG_NTSYNC=y
        EOF

    # ── 17. BBRv3 + qdiscs + TTL ───────────────────────────────────────────────
    - name: Add BBRv3
      working-directory: kernel_platform/common
      run: |
        git clone --depth 1 https://github.com/WildKernels/kernel_patches.git "$GITHUB_WORKSPACE/kernel_patches"
        P="$GITHUB_WORKSPACE/kernel_patches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch"
        [ -f "$P" ] || { echo "❌ BBRv3 patch missing: $P"; ls "$GITHUB_WORKSPACE/kernel_patches/common/bbrv3" 2>&1; exit 1; }

        patch -p1 < "$P" || true
        find . -name "*.rej" -print   # shows rejects before cleanup
        grep -q "TCP_CONG_BBR3" net/ipv4/Kconfig \
          && echo "✅ BBR3 Kconfig present" \
          || { echo "❌ BBR3 not applied"; exit 1; }
        find . -name "*.rej" -delete
        find . -name "*.orig" -delete

        C="./scripts/config --file $GKI_DEFCONFIG"
        for o in NET_SCH_FQ NET_SCH_FQ_CODEL NET_SCH_CAKE NET_SCH_PIE NET_SCH_FQ_PIE \
                 TCP_CONG_ADVANCED TCP_CONG_BBR TCP_CONG_BBR3 TCP_CONG_CUBIC; do
          $C --enable CONFIG_$o
        done
        for o in TCP_CONG_BIC TCP_CONG_WESTWOOD TCP_CONG_HTCP; do
          $C --disable CONFIG_$o
        done

    - name: Add TTL support
      working-directory: kernel_platform/common
      run: |
        C="./scripts/config --file $GKI_DEFCONFIG"
        $C --enable CONFIG_IP_NF_TARGET_TTL
        $C --enable CONFIG_IP6_NF_TARGET_HL
        $C --enable CONFIG_IP6_NF_MATCH_HL

    # ── 17b. RTL88XXAU (aircrack-ng, Kali commit) as module ────────────────────
    - name: Add RTL88XXAU driver
      working-directory: kernel_platform/common
      run: |
        D=drivers/net/wireless/rtl8812au
        git clone https://github.com/aircrack-ng/rtl8812au.git $D
        git -C $D checkout c3fb89a
        rm -rf $D/.git

        cat > $D/Kconfig << 'EOF'
        config 88XXAU
        	tristate "Realtek 88XXau USB WiFi (AWUS036ACH)"
        	depends on USB
        EOF
        echo 'source "drivers/net/wireless/rtl8812au/Kconfig"' >> drivers/net/wireless/Kconfig
        echo 'obj-$(CONFIG_88XXAU) += rtl8812au/' >> drivers/net/wireless/Makefile

        # clang-safe flags, smaller module, logging on
        sed -i 's/-Wno-cast-function-type//; s/-Wno-stringop-overread//; s/ -g$//' $D/Makefile
        sed -i '/^EXTRA_LDFLAGS/d' $D/Makefile
        sed -i 's/^CONFIG_RTW_DEBUG *= *n/CONFIG_RTW_DEBUG = y/; s/^CONFIG_RTW_LOG_LEVEL *= *2/CONFIG_RTW_LOG_LEVEL = 4/' $D/Makefile

        {
          echo "ccflags-y += -Wno-error -Wno-uninitialized -Wno-header-guard -Wno-unknown-warning-option"
          echo "ccflags-y += -DCONFIG_NL80211_TESTMODE=1"
          echo "ccflags-y += -Daes_encrypt=ra8812_aes_encrypt -Daes_decrypt=ra8812_aes_decrypt"
          find $D -type d | while read d; do echo "ccflags-y += -I\$(srctree)/$d"; done
        } > /tmp/top.mk
        cat /tmp/top.mk $D/Makefile > /tmp/new.mk
        mv /tmp/new.mk $D/Makefile

        echo "--- top of driver Makefile ---"
        head -6 $D/Makefile

        echo "CONFIG_88XXAU=m" >> "$GKI_DEFCONFIG"

    # ── 17c. AR9271 (ath9k_htc) as modules ─────────────────────────────────────
    - name: Show Samsung wifi config (info only)
      run: |
        find kernel_platform -type f -path '*arm64/configs*' \( -name '*.config' -o -name '*defconfig' \) \
          -exec grep -HE '^CONFIG_(CFG80211|MAC80211|NL80211_TESTMODE)[A-Z0-9_]*=' {} + 2>/dev/null | head -80 || true

    - name: Add ath9k_htc (AR9271)
      working-directory: kernel_platform/common
      run: |
        test -f drivers/net/wireless/ath/ath9k/htc_drv_main.c \
          || { echo "❌ ath9k_htc source missing from tree"; exit 1; }

        C="./scripts/config --file $GKI_DEFCONFIG"
        $C --module CONFIG_CFG80211
        $C --module CONFIG_MAC80211
        $C --enable CONFIG_MAC80211_LEDS
        # match vendor ieee80211_ops layout
        $C --enable CONFIG_NL80211_TESTMODE
        $C --enable CONFIG_WLAN_VENDOR_ATH
        $C --module CONFIG_ATH9K_HTC

        # firmware built into the kernel (no file / path / SELinux on the phone)
        F="$GITHUB_WORKSPACE/fwdir"
        mkdir -p "$F/ath9k_htc"
        curl -fL -o "$F/ath9k_htc/htc_9271-1.4.0.fw" \
          "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath9k_htc/htc_9271-1.4.0.fw"
        [ "$(stat -c %s "$F/ath9k_htc/htc_9271-1.4.0.fw")" -eq 51008 ] \
          || { echo "❌ firmware download wrong size"; exit 1; }
        $C --set-str CONFIG_EXTRA_FIRMWARE "ath9k_htc/htc_9271-1.4.0.fw"
        $C --set-str CONFIG_EXTRA_FIRMWARE_DIR "$F"

    # ── 17d. rtw88 backport (RTL8812AU, mac80211) as modules ───────────────────
    - name: Add rtw88 (RTL8812AU)
      working-directory: kernel_platform/common
      run: |
        D=drivers/net/wireless/rtw88bp
        # Pinned: upstream commit d916ef8 (2026-09-02) added device_get_mac_address(),
        # which doesn't exist on 5.10. Use its parent so the build is reproducible.
        git clone https://github.com/lwfinger/rtw88.git /tmp/rtw88
        git -C /tmp/rtw88 checkout d916ef8~1
        mkdir -p $D
        cp /tmp/rtw88/*.c /tmp/rtw88/*.h $D/

        # 5.10 has no 2-arg device_get_mac_address(); stub it so the driver
        # falls through to eth_random_addr() (fixes main.c:2170 build error)
        sed -i 's/device_get_mac_address(rtwdev->dev, efuse->addr)/(-ENODEV)/' $D/main.c
        echo "--- remaining device_get_mac_address refs (should be none):"
        grep -n 'device_get_mac_address' $D/*.c $D/*.h || echo "none"

        # mac80211 on 5.10 has no ieee80211_purge_tx_queue() (added later);
        # shim it and force-include the shim into every rtw88bp object
        cat > $D/compat.h << 'EOF'
        #ifndef RTW88BP_COMPAT_H
        #define RTW88BP_COMPAT_H
        #include <linux/skbuff.h>
        #include <net/mac80211.h>
        static inline void ieee80211_purge_tx_queue(struct ieee80211_hw *hw,
        					    struct sk_buff_head *skbs)
        {
        	struct sk_buff *skb;

        	while ((skb = skb_dequeue(skbs)))
        		ieee80211_free_txskb(hw, skb);
        }
        #endif
        EOF

        cat > $D/Kconfig << 'EOF'
        config RTW88BP
        	tristate "Realtek rtw88 backport (RTL8812AU)"
        	depends on USB && MAC80211
        EOF
        echo 'source "drivers/net/wireless/rtw88bp/Kconfig"' >> drivers/net/wireless/Kconfig
        echo 'obj-$(CONFIG_RTW88BP) += rtw88bp/' >> drivers/net/wireless/Makefile

        cat > $D/Makefile << 'EOF'
        ccflags-y += -std=gnu11 -Wno-declaration-after-statement -Wno-error -Wno-unknown-warning-option
        ccflags-y += -DCONFIG_RTW88_LEDS=1 -DCONFIG_RTW88_DEBUG=1 -D__CHECK_ENDIAN__
        ccflags-y += -include $(srctree)/drivers/net/wireless/rtw88bp/compat.h

        obj-$(CONFIG_RTW88BP) += rtw_core.o rtw_usb.o rtw_88xxa.o rtw_8812a.o rtw_8812au.o

        rtw_core-objs := main.o led.o mac80211.o util.o debug.o tx.o rx.o mac.o phy.o \
        		 coex.o efuse.o fw.o ps.o sec.o bf.o regd.o sar.o
        ifeq ($(CONFIG_PM),y)
        rtw_core-objs += wow.o
        endif
        rtw_usb-objs := usb.o
        rtw_88xxa-objs := rtw88xxa.o
        rtw_8812a-objs := rtw8812a.o rtw8812a_table.o
        rtw_8812au-objs := rtw8812au.o
        EOF

        # firmware: add to the existing built-in list (keep the AR9271 one)
        F="$GITHUB_WORKSPACE/fwdir"
        mkdir -p "$F/rtw88"
        cp /tmp/rtw88/firmware/rtw8812a_fw.bin "$F/rtw88/"
        test -f "$F/ath9k_htc/htc_9271-1.4.0.fw" || { echo "❌ run 17c first"; exit 1; }

        C="./scripts/config --file $GKI_DEFCONFIG"
        $C --module CONFIG_RTW88BP
        $C --set-str CONFIG_EXTRA_FIRMWARE "ath9k_htc/htc_9271-1.4.0.fw rtw88/rtw8812a_fw.bin"
        $C --set-str CONFIG_EXTRA_FIRMWARE_DIR "$F"

    # ── 17e. DEBUG: pre-build sanity check ─────────────────────────────────────
    # Cheap checks that run BEFORE the long build so we catch obvious problems.
    - name: "DEBUG: Pre-build sanity"
      run: |
        mkdir -p "$GITHUB_WORKSPACE/debug"
        {
          echo "=== date / disk / mem ==="
          date; df -h /; free -h
          echo
          echo "=== final defconfig tail (what we appended) ==="
          tail -n 120 "$GKI_DEFCONFIG"
          echo
          echo "=== duplicate CONFIG_ keys in defconfig (last one wins) ==="
          grep -E '^CONFIG_[A-Za-z0-9_]+=' "$GKI_DEFCONFIG" | cut -d= -f1 | sort | uniq -d
          echo
          echo "=== EXTRA_FIRMWARE lines ==="
          grep -n 'EXTRA_FIRMWARE' "$GKI_DEFCONFIG"
          ls -laR "$GITHUB_WORKSPACE/fwdir" 2>&1
          echo
          echo "=== leftover .rej / .orig anywhere in kernel tree ==="
          find kernel_platform/common \( -name '*.rej' -o -name '*.orig' \) 2>/dev/null | head -20
          echo
          echo "=== toolchain ==="
          CLANG=$(find kernel_platform -type f -name clang -path '*/clang-*/bin/*' 2>/dev/null | head -1)
          echo "clang: $CLANG"
          [ -n "$CLANG" ] && "$CLANG" --version
          echo
          echo "=== build script target ==="
          grep -n 'BUILD_TARGET' build_kernel_GKI.sh | head
        } 2>&1 | tee "$GITHUB_WORKSPACE/debug/01-prebuild.txt"

    # ── 18. Build ──────────────────────────────────────────────────────────────
    - name: Build Kernel
      if: ${{ !inputs.qcacld3_only }}
      run: |
        mkdir -p out/vendor/qcom/opensource/mmrm-driver/
        touch out/vendor/qcom/opensource/mmrm-driver/Module.symvers
        mkdir -p out/target/product/q4q/
        mkdir -p "$GITHUB_WORKSPACE/debug"
        export LTO=full
        export KBUILD_MODPOST_WARN=1
        # keep going after the first compile error so ONE run lists every failing file
        export MAKEFLAGS=k
        # full log kept in debug/build.log; `|| true` keeps the pipeline going
        # so the grab/debug steps below always run
        bash build_kernel_GKI.sh 2>&1 | tee "$GITHUB_WORKSPACE/debug/build.log" || true
        echo "build script exit status: ${PIPESTATUS[0]}"

    # ── 18a. DEBUG: post-build report ──────────────────────────────────────────
    - name: "DEBUG: Post-build report"
      if: always() && !inputs.qcacld3_only
      run: |
        mkdir -p "$GITHUB_WORKSPACE/debug"
        R="$GITHUB_WORKSPACE/debug/02-postbuild.txt"
        {
          echo "=== disk / mem ==="; df -h /; free -h
          echo
          echo "=== out/ top levels ==="
          ls -la out 2>&1; find out -maxdepth 3 -type d 2>/dev/null | head -60
          echo
          echo "=== Image / vmlinux / Module.symvers / .config ==="
          find out \( -name 'Image' -o -name 'Image.lz4' -o -name 'vmlinux' -o -name 'Module.symvers' -o -name '.config' \) \
            -exec ls -la {} \; 2>/dev/null | head -40
          echo
          echo "=== ALL .ko produced by the build ==="
          find out -name '*.ko' -exec ls -la {} \; 2>/dev/null | sort -k9 | head -200
          echo
          echo "=== wlan / cnss / qca related .ko ==="
          find out -name '*.ko' 2>/dev/null | grep -i -E 'qca|cnss|wlan|cld' || echo "(none)"
          echo
          echo "=== our WiFi modules ==="
          for m in 88XXau mac80211 cfg80211 ath ath9k_hw ath9k_common ath9k_htc rtw_core rtw_usb rtw_88xxa rtw_8812a rtw_8812au; do
            f=$(find out -name "$m.ko" | head -1); echo "$m: ${f:-MISSING}"
          done
          echo
          echo "=== resulting .config: key options ==="
          CFG=$(find out -name '.config' -path '*gki*' | head -1)
          echo "using: $CFG"
          [ -n "$CFG" ] && grep -E '^(# )?CONFIG_(KSU|KSU_SUSFS|NOMOUNT|BBG|NTSYNC|TCP_CONG_BBR3|88XXAU|RTW88BP|ATH9K_HTC|CFG80211|MAC80211|CNSS2|QCA_CLD_WLAN|MODVERSIONS|MODULE_SIG|LTO_CLANG|EXTRA_FIRMWARE|LSM)[A-Z0-9_]*[ =]' "$CFG"
          echo
          echo "=== build.log: errors ==="
          grep -n -E 'error:|Error [0-9]|\*\*\* |undefined reference|undefined symbol|No rule to make target|fatal:' \
            "$GITHUB_WORKSPACE/debug/build.log" 2>/dev/null | head -80
          echo
          echo "=== build.log: modpost / symbol warnings ==="
          grep -n -i -E 'modpost|undefined!|Module.symvers|CRC' "$GITHUB_WORKSPACE/debug/build.log" 2>/dev/null | head -40
          echo
          echo "=== build.log: last 80 lines ==="
          tail -n 80 "$GITHUB_WORKSPACE/debug/build.log" 2>/dev/null
        } > "$R" 2>&1
        # show the most useful part in the Actions UI
        sed -n '1,400p' "$R"

    # ── 18b. QCACLD3 from Samsung vendor/qcom source ───────────────────────────
    - name: Build QCACLD3 (qca_cld3)
      if: always()
      continue-on-error: true
      run: |
        mkdir -p "$GITHUB_WORKSPACE/debug" "$GITHUB_WORKSPACE/modules"
        LOG="$GITHUB_WORKSPACE/debug/qcacld3.log"
        exec > >(tee "$LOG") 2>&1
        set -x

        # ---- locate sources --------------------------------------------------
        WLAN_ROOT=$(find "$GITHUB_WORKSPACE" -type d -name 'qcacld-3.0' \
          -not -path '*/.git/*' -not -path "$GITHUB_WORKSPACE/out/*" | head -1)
        [ -d "$WLAN_ROOT" ] || { echo "❌ qcacld-3.0 not found in Samsung source"; exit 1; }
        WLAN_TOP=$(dirname "$WLAN_ROOT")
        echo "WLAN_ROOT=$WLAN_ROOT"
        ls -la "$WLAN_TOP"

        # ---- locate kernel build dir (needs vmlinux-adjacent .config + Module.symvers) ----
        KOUT=""
        for v in $(find out -name vmlinux -path '*gki*' 2>/dev/null); do
          d=$(dirname "$v")
          if [ -f "$d/.config" ]; then KOUT=$(realpath "$d"); break; fi
        done
        FAST=""
        if [ -z "$KOUT" ]; then
          CFGF=$(find out -name .config -path '*gki*' 2>/dev/null | head -1)
          if [ -n "$CFGF" ]; then
            KOUT=$(realpath "$(dirname "$CFGF")")
          else
            echo "ℹ️ no kernel out dir (fast mode): generating a prepared kernel tree"
            KOUT="$GITHUB_WORKSPACE/out_fast"; mkdir -p "$KOUT"; FAST=1
          fi
        fi
        KSRC="$GITHUB_WORKSPACE/kernel_platform/common"
        export KBUILD_MODPOST_WARN=1   # unresolved vendor symbols become warnings, not errors

        # what Qualcomm's own Android.mk says about chip/profile (for debugging)
        grep -n -E 'WLAN_PROFILE|CHIP|KBUILD_OPTIONS|qca6490|MODNAME' "$WLAN_ROOT/Android.mk" | head -40 || true

        # ---- kernel release string (module vermagic MUST equal it) ------------
        # Read it from the real Image banner BEFORE any make touches KOUT. Re-running
        # modules_prepare otherwise regenerates utsrelease.h from the git hash
        # (that is how the last .ko got vermagic "5.10.209-g8bea92183287").
        REL=""
        IMG=$(find out -type f -name Image -path '*gki*' 2>/dev/null | head -1)
        [ -n "$IMG" ] && REL=$(strings "$IMG" | grep -m1 -oE 'Linux version [^ ]+' | awk '{print $3}')
        if [ -z "$REL" ]; then
          REL="5.10.209-android12-9-gki-29539737-abF936BXXSAGYB2"   # fast mode: stock release string
          echo "ℹ️ no built Image; using stock release string"
        fi
        echo "Kernel release the module will be built for: $REL"
        echo "KOUT=$KOUT  KSRC=$KSRC"
        ls -la "$KOUT" | head -30
        [ -f "$KOUT/Module.symvers" ] && wc -l "$KOUT/Module.symvers" || echo "⚠️ no Module.symvers in KOUT"

        # ---- toolchain -------------------------------------------------------
        # Samsung's toolchain lives in kernel_platform/prebuilts-master/clang/host/linux-x86/clang-*/bin
        CLANG=$(find kernel_platform -type f -name clang -path '*/clang-*/bin/*' | head -1)
        [ -n "$CLANG" ] || { echo "❌ clang not found"; find kernel_platform -maxdepth 4 -type d -name 'clang*' | head; exit 1; }
        export PATH="$(realpath "$(dirname "$CLANG")"):$PATH"
        clang --version

        # CROSS_COMPILE makes clang target aarch64 (without it clang targets x86 and
        # the arm64 headers fail with "unknown register name 'x0' in asm")
        MK="make -C $KSRC O=$KOUT ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- KERNELRELEASE=$REL -j$(nproc)"
        [ -n "$FAST" ] && $MK gki_defconfig </dev/null   # fast mode: same defconfig the real build uses
        # avoid the interactive CONFIG_WERROR prompt and warnings-as-errors for vendor code
        "$KSRC/scripts/config" --file "$KOUT/.config" -d WERROR || true
        $MK olddefconfig </dev/null
        $MK modules_prepare </dev/null

        # NOTE: do NOT list $KOUT/Module.symvers here. Kbuild already reads it for external
        # modules; passing it again makes modpost abort with
        # "'media_entity_pads_init' exported twice". Only add NEW symvers (cnss etc.).
        EXTRA_SYMS=""

        # ---- optional: platform (cnss2 etc.) first so we get their symbols ----
        PLAT=$(find "$WLAN_TOP" -maxdepth 2 -type d -name platform | head -1)
        if [ -n "$PLAT" ] && { [ -f "$PLAT/Kbuild" ] || [ -f "$PLAT/Makefile" ]; }; then
          echo "--- building wlan platform: $PLAT"
          $MK M="$PLAT" KBUILD_EXTRA_SYMBOLS="$EXTRA_SYMS" \
            CONFIG_CNSS2=m CONFIG_CNSS_QCA6490=y modules || echo "⚠️ platform build failed (non-fatal)"
          [ -f "$PLAT/Module.symvers" ] && EXTRA_SYMS="$EXTRA_SYMS $PLAT/Module.symvers"
          find "$PLAT" -name '*.ko' -exec ls -la {} \;
        else
          echo "ℹ️ no buildable platform dir found (cnss2 may be built into the kernel)"
        fi

        # ---- Qualcomm-only headers --------------------------------------------
        # QCACLD3 includes vendor headers (linux/qcom-iommu-util.h, soc/qcom/*, ...)
        # that exist in Samsung's msm-kernel tree but not in the GKI "common" tree.
        # Stage ONLY headers that GKI doesn't already have, so nothing in GKI is shadowed.
        MSM="$GITHUB_WORKSPACE/kernel_platform/msm-kernel"
        QINC="$GITHUB_WORKSPACE/qcom_inc"
        rm -rf "$QINC"; mkdir -p "$QINC"
        set +x   # keep the log small: no per-file tracing for ~460 copies
        if [ -d "$MSM/include" ]; then
          ( cd "$MSM/include" && find . -type f -name '*.h' ) | while read -r f; do
            [ -e "$KSRC/include/$f" ] || { mkdir -p "$QINC/$(dirname "$f")"; cp "$MSM/include/$f" "$QINC/$f"; }
          done
        fi
        set -x
        echo "staged $(find "$QINC" -type f | wc -l) Qualcomm-only headers into $QINC"
        ls -la "$QINC/linux/qcom-iommu-util.h" 2>&1 || find kernel_platform -name 'qcom-iommu-util.h' | head

        # ---- cnss2 + helpers ---------------------------------------------------
        # Stock wlan.ko depends on: cnss2 cnss_prealloc cnss_nl cnss_utils.
        # They live in msm-kernel (not GKI). Build them so QCACLD3 gets their symbol
        # CRCs (otherwise "depends:" is empty and the module can't resolve them).
        ls "$MSM/drivers/net/wireless" | grep -i cnss || echo "⚠️ no cnss dirs in msm-kernel"
        for n in cnss_utils cnss_prealloc cnss_genl cnss2; do
          d="$MSM/drivers/net/wireless/$n"
          [ -d "$d" ] || { echo "ℹ️ $d missing, skipping"; continue; }
          $MK -k M="$d" KCFLAGS="-I$QINC -I$QINC/uapi" \
            CONFIG_CNSS2=m CONFIG_CNSS_UTILS=m CONFIG_CNSS_PREALLOC=m CONFIG_CNSS_GENL=m CONFIG_CNSS_QCA6490=y \
            KBUILD_EXTRA_SYMBOLS="$EXTRA_SYMS" modules || echo "⚠️ cnss build failed in $d (continuing)"
          [ -f "$d/Module.symvers" ] && EXTRA_SYMS="$EXTRA_SYMS $d/Module.symvers"
          find "$d" -name '*.ko' -exec ls -la {} \;
        done
        echo "EXTRA_SYMS=$EXTRA_SYMS"

        # ---- QCACLD3 itself (waipio / SM8475 → QCA6490) ----------------------
        # -k: keep compiling after the first error so one run lists every missing header/symbol
        $MK -k M="$WLAN_ROOT" \
          KCFLAGS="-I$QINC -I$QINC/uapi" \
          WLAN_ROOT="$WLAN_ROOT" \
          WLAN_COMMON_ROOT=../qca-wifi-host-cmn \
          WLAN_FW_API="$WLAN_TOP/fw-api" \
          WLAN_PROFILE=qca6490 \
          CONFIG_QCA_CLD_WLAN=m \
          CONFIG_CNSS2=y CONFIG_CNSS_QCA6490=y \
          MODNAME=wlan \
          KBUILD_EXTRA_SYMBOLS="$EXTRA_SYMS" \
          modules

        # ---- collect ---------------------------------------------------------
        find "$WLAN_TOP" -name '*.ko' -exec ls -la {} \;
        for KO in $(find "$WLAN_TOP" -name 'qca_cld3*.ko' -o -name 'wlan.ko' | head -5); do
          cp "$KO" "$GITHUB_WORKSPACE/modules/" && echo "✅ $KO"
          "$(dirname "$CLANG")/llvm-strip" --strip-debug "$GITHUB_WORKSPACE/modules/$(basename "$KO")" || true
        done

        # ---- remove the git hash ("scmversion=g....") from wlan.ko ---------------
        # The stock module has no scmversion. The string lives in .modinfo as
        # NUL-separated entries, so blanking it in place (same length) is safe:
        # the kernel's modinfo parser skips empty entries.
        if [ -f "$GITHUB_WORKSPACE/modules/wlan.ko" ]; then
          python3 - "$GITHUB_WORKSPACE/modules/wlan.ko" << 'PY'
        import re, sys
        p = sys.argv[1]
        b = bytearray(open(p, 'rb').read())
        n = 0
        for m in list(re.finditer(rb'scmversion=[^\x00]*', bytes(b))):
            b[m.start():m.end()] = b'\x00' * (m.end() - m.start())
            n += 1
        open(p, 'wb').write(b)
        print("scrubbed scmversion entries:", n)
        PY
          echo "scmversion now: '$(modinfo -F scmversion "$GITHUB_WORKSPACE/modules/wlan.ko" 2>/dev/null)'"
        fi
        # symbol sanity: what does the module need that the kernel lacks?
        for KO in "$GITHUB_WORKSPACE"/modules/wlan.ko; do
          [ -f "$KO" ] || continue
          modinfo "$KO" 2>/dev/null | head -20 || true
          VM=$(modinfo -F vermagic "$KO" 2>/dev/null)
          DEPS=$(modinfo -F depends "$KO" 2>/dev/null)
          ls -la "$KO"
          case "$VM" in "$REL "*) echo "✅ vermagic matches kernel release";; *) echo "❌ vermagic '$VM' != release '$REL'";; esac
          echo "depends: '$DEPS'  (stock: cnss2,cfg80211,cnss_prealloc,cnss_nl,cnss_utils)"
        done

    # ── 19. Grab Kernel & Driver Artifacts ────────────────────────────────────
    - name: Grab Kernel Image
      if: always() && !inputs.qcacld3_only
      id: package
      run: |
        GKI_DIST="out/msm-waipio-waipio-gki/gki_kernel/dist"

        IMAGE="$GKI_DIST/Image"
        if [ ! -f "$IMAGE" ]; then
          echo "⚠️ Image not in dist, checking raw build directory..."
          IMAGE=$(find out/ -type f -name "Image" -path "*gki*" | head -n 1)
        fi

        IMAGE_LZ4="$GKI_DIST/Image.lz4"
        if [ ! -f "$IMAGE_LZ4" ]; then
          IMAGE_LZ4=$(find out/ -type f -name "Image.lz4" -path "*gki*" | head -n 1)
        fi

        if [ -z "$IMAGE" ] || [ ! -f "$IMAGE" ]; then
          echo "❌ Image not found anywhere"
          find out -name 'Image*' | head -20
          exit 1
        fi

        # Grab the compiled 88XXau module
        KO=$(find out -name '88XXau.ko' | head -n 1)
        if [ -n "$KO" ] && [ -f "$KO" ]; then
          cp "$KO" "$GITHUB_WORKSPACE/88XXau.ko"
          echo "✅ Found and copied module: $KO"
        else
          echo "⚠️ 88XXau.ko not found"
        fi

        # Grab the compiled ath9k_htc (AR9271) modules
        mkdir -p "$GITHUB_WORKSPACE/modules"
        for m in mac80211 ath ath9k_hw ath9k_common ath9k_htc; do
          f=$(find out -name "$m.ko" | head -n 1)
          if [ -n "$f" ]; then cp "$f" "$GITHUB_WORKSPACE/modules/"; echo "✅ $m.ko"; else echo "⚠️ $m.ko missing"; fi
        done

        # Grab the compiled rtw88 (RTL8812AU) modules
        for m in rtw_core rtw_usb rtw_88xxa rtw_8812a rtw_8812au; do
          f=$(find out -name "$m.ko" | head -n 1)
          if [ -n "$f" ]; then cp "$f" "$GITHUB_WORKSPACE/modules/"; echo "✅ $m.ko"; else echo "⚠️ $m.ko missing"; fi
        done

        # QCACLD3 (built out-of-tree in step 18b, already copied into modules/)
        ls "$GITHUB_WORKSPACE"/modules/wlan.ko >/dev/null 2>&1 \
          && echo "✅ wlan.ko (QCACLD3) present" \
          || echo "⚠️ wlan.ko (QCACLD3) missing (see debug/qcacld3.log)"

        # Strip debug symbols from all modules
        STRIP=$(find kernel_platform -type f -name llvm-strip | head -1)
        if [ -n "$STRIP" ]; then
          for f in "$GITHUB_WORKSPACE"/modules/*.ko "$GITHUB_WORKSPACE/88XXau.ko"; do
            [ -f "$f" ] && "$STRIP" --strip-debug "$f"
          done
        fi

        echo "✅ Image: $IMAGE ($(du -h "$IMAGE" | cut -f1))"
        [ -n "$IMAGE_LZ4" ] && [ -f "$IMAGE_LZ4" ] && echo "✅ Image.lz4: $IMAGE_LZ4 ($(du -h "$IMAGE_LZ4" | cut -f1))"
        
        echo "image=$IMAGE" >> $GITHUB_OUTPUT
        echo "image_lz4=$IMAGE_LZ4" >> $GITHUB_OUTPUT

    - name: Upload to GoFile
      if: always() && (steps.package.outcome == 'success' || inputs.qcacld3_only)
      run: |
        SERVER=$(curl -s https://api.gofile.io/servers | \
          python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['servers'][0]['name'])")
        up() {
          local f="$1" label="$2" resp
          [ -n "$f" ] && [ -f "$f" ] || return 0
          resp=$(curl -s -F "file=@$f" "https://$SERVER.gofile.io/uploadFile")
          echo "✅ $label → $(echo "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['downloadPage'])" 2>/dev/null || echo "upload failed: $resp")"
        }
        up "${{ steps.package.outputs.image }}"     "Image"
        up "${{ steps.package.outputs.image_lz4 }}" "Image.lz4"
        up "88XXau.ko"                              "88XXau.ko"
        # QCACLD3 (Qualcomm wlan) driver(s)
        for f in modules/qca_cld3*.ko modules/wlan.ko; do up "$f" "$(basename "$f")"; done

    - name: Upload to GitHub Artifacts
      if: always() && steps.package.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: Fold4-KSUNext-SUSFS-Droidspaces-NoMount
        path: |
          ${{ steps.package.outputs.image }}
          ${{ steps.package.outputs.image_lz4 }}
          88XXau.ko
          modules/*.ko
        compression-level: 0

    - name: Upload QCACLD3 module (fast mode)
      if: always() && inputs.qcacld3_only
      uses: actions/upload-artifact@v4
      with:
        name: wlan-ko-only
        path: modules/wlan.ko
        if-no-files-found: ignore
        compression-level: 0

    # ── 20. Collect patch rejects (always) ─────────────────────────────────────
    - name: Collect Patch Rejects
      if: always()
      run: |
        REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
        mkdir -p "$REJECTS_DIR"
        mapfile -t REJS < <(find kernel_platform -name "*.rej" 2>/dev/null)
        if [ ${#REJS[@]} -eq 0 ]; then
          echo "✅ No rejected patches"
          exit 0
        fi
        echo "⚠️ Collecting ${#REJS[@]} reject file(s):"
        for REJ in "${REJS[@]}"; do
          echo "  $REJ"
          REL="${REJ#kernel_platform/}"
          DEST="$REJECTS_DIR/$REL"
          mkdir -p "$(dirname "$DEST")"
          cp "$REJ" "$DEST"
          ORIG="${REJ%.rej}"
          [ -f "$ORIG" ] && cp "$ORIG" "$REJECTS_DIR/${REL%.rej}"
        done

    - name: Upload Patch Rejects
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: patch-rejects
        path: patch-rejects/
        if-no-files-found: ignore

    # ── 21. Upload debug logs (always) ─────────────────────────────────────────
    - name: Upload Debug Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-logs
        path: debug/
        if-no-files-found: ignore

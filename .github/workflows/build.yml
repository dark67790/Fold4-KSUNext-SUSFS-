name: Build Fold4 Kernel (KSU-Next)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space and Create Swap
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo rm -rf "/usr/local/share/boost" /usr/lib/jvm /usr/share/swift
        sudo apt-get clean
        sudo dd if=/dev/zero of=/swapfile-extra bs=1M count=12288 status=progress
        sudo chmod 600 /swapfile-extra
        sudo mkswap /swapfile-extra
        sudo swapon /swapfile-extra
        free -h

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev \
          python3-pip unzip git patch coreutils curl build-essential cpio wget

    - name: Download and Extract Samsung Source
      run: |
        pip install gdown
        gdown 1TjP4Sr-yJuZ4sZ69Fo1KWNh_sVn_jN2M -O samsung.zip
        unzip samsung.zip
        tar -xf Kernel.tar.gz
        tar -xf Platform.tar.gz
        rm samsung.zip Kernel.tar.gz Platform.tar.gz

    - name: Download Clang and GAS
      run: |
        cd kernel_platform
        mkdir -p prebuilts-master/clang/host/linux-x86/clang-r416183b
        curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/bd96dfe349c962681f0e5388af874c771ef96670/clang-r416183b.tar.gz" -o clang.tar.gz
        tar -xzf clang.tar.gz -C prebuilts-master/clang/host/linux-x86/clang-r416183b
        rm clang.tar.gz
        mkdir -p prebuilts/gas/linux-x86
        curl -LSs "https://android.googlesource.com/platform/prebuilts/gas/linux-x86/+archive/refs/heads/master.tar.gz" -o gas.tar.gz
        tar -xzf gas.tar.gz -C prebuilts/gas/linux-x86
        rm gas.tar.gz

    - name: Setup Host Tools and Sysroot
      run: |
        chmod -R u+w kernel_platform/build
        TOOLS_DIR=$(pwd)/kernel_platform/build/build-tools/path/linux-x86
        mkdir -p "$TOOLS_DIR"
        find /usr/bin /bin -maxdepth 1 -type f -executable -exec ln -sf {} "$TOOLS_DIR/" \;
        rm -f "$TOOLS_DIR/gcc" "$TOOLS_DIR/g++" "$TOOLS_DIR/ufdt_apply_overlay"
        
        printf '#!/bin/bash\nexec /usr/bin/gcc -I/usr/include -I/usr/include/x86_64-linux-gnu "$@"\n' > "$TOOLS_DIR/gcc"
        printf '#!/bin/bash\nexec /usr/bin/g++ -I/usr/include -I/usr/include/x86_64-linux-gnu "$@"\n' > "$TOOLS_DIR/g++"
        # Ghost tool remains as a fallback safety
        printf '#!/bin/bash\nexit 0\n' > "$TOOLS_DIR/ufdt_apply_overlay"
        chmod +x "$TOOLS_DIR/gcc" "$TOOLS_DIR/g++" "$TOOLS_DIR/ufdt_apply_overlay"
        
        KBT=$(pwd)/kernel_platform/prebuilts/kernel-build-tools/linux-x86/lib64
        mkdir -p "$KBT"
        cp /usr/lib/x86_64-linux-gnu/crt1.o "$KBT/"
        cp /usr/lib/x86_64-linux-gnu/crti.o "$KBT/"
        cp /usr/lib/x86_64-linux-gnu/crtn.o "$KBT/"
        ln -sf /usr/lib/x86_64-linux-gnu/libc.so.6 "$KBT/libc.so.6"
        echo "GROUP ( /usr/lib/x86_64-linux-gnu/libc.so.6 /usr/lib/x86_64-linux-gnu/libc_nonshared.a )" > "$KBT/libc.so"

    - name: Setup KernelSU-Next
      working-directory: kernel_platform/common
      run: |
        chmod -R u+w .
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

    - name: Source Surgery RKP Fix
      run: |
        GAF_FILE="kernel_platform/common/security/samsung/proca/gaf/gaf_v6.c"
        if [ -f "$GAF_FILE" ]; then
          chmod u+w "$GAF_FILE"
          sed -i 's/\.task_struct_integrity = OFFSETOF_INTEGRITY,/#ifdef CONFIG_RKP\n\t.task_struct_integrity = OFFSETOF_INTEGRITY,\n#endif/g' "$GAF_FILE"
          sed -i 's/\.cred_integrity = OFFSETOF_CRED_INTEGRITY,/#ifdef CONFIG_RKP\n\t.cred_integrity = OFFSETOF_CRED_INTEGRITY,\n#endif/g' "$GAF_FILE"
        fi

    - name: Patch Defconfigs
      run: |
        FLAGS=(
          "CONFIG_SECURITY_DEFEX" "CONFIG_PROCA" "CONFIG_FIVE" "CONFIG_UH"
          "CONFIG_RKP" "CONFIG_KDP" "CONFIG_KDP_CRED" "CONFIG_KDP_NS"
          "CONFIG_KNOX_KAP" "CONFIG_SEC_ARM64_AP_CONTEXT" "CONFIG_SEC_ABC"
        )
        find kernel_platform -type f -name "*defconfig" | while read -r config; do
          chmod u+w "$config"
          for flag in "${FLAGS[@]}"; do
            sed -i "s/${flag}=y/# ${flag} is not set/g" "$config"
            echo "# ${flag} is not set" >> "$config"
          done
          # Force Kprobes for KSU
          grep -q "CONFIG_KPROBES=y" "$config" || echo "CONFIG_KPROBES=y" >> "$config"
        done

    - name: Build kernel
      run: |
        # THE KILL SWITCHES:
        export MAKE_GOALS="Image"         # Only compile the kernel Image
        export SKIP_EXT_MODULES=1        # Skip Techpack (Audio/Camera/Display)
        export SKIP_VENDOR_BOOT=1        # Don't look for vendor_boot
        export BUILD_BOOT_IMG=           # Disable boot.img creation
        export BUILD_VENDOR_BOOT_IMG=    # Disable vendor_boot.img creation
        
        # Kill the external module list in the Samsung script manually
        sed -i 's/export KBUILD_EXT_MODULES=/#export KBUILD_EXT_MODULES=/g' build_kernel_GKI.sh
        
        # Assassinate the config-checker
        find . -type f -name "*.sh" -exec sed -i 's/check_merged_defconfig/true/g' {} +

        # Fix Host Tool arguments in build.sh
        sed -i 's/TOOL_ARGS+=("LLVM=1")/TOOL_ARGS+=("LLVM=1" "HOSTCC=gcc" "HOSTCXX=g++" "HOSTCFLAGS=-I\/usr\/include -I\/usr\/include\/x86_64-linux-gnu" "HOSTLDFLAGS=-L\/usr\/lib\/x86_64-linux-gnu")/' \
          kernel_platform/build/build.sh
        
        export LTO=thin
        bash build_kernel_GKI.sh

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: Fold4-KSUNext-Image
        path: kernel_platform/out/msm-waipio-waipio-gki/dist/Image


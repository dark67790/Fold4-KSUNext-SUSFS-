name: Build Fold4 Kernel (KSU-Next + SUSFS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space and Create Swap
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo rm -rf "/usr/local/share/boost" /usr/lib/jvm /usr/share/swift
        sudo apt-get clean
        sudo dd if=/dev/zero of=/swapfile-extra bs=1M count=12288 status=progress
        sudo chmod 600 /swapfile-extra
        sudo mkswap /swapfile-extra
        sudo swapon /swapfile-extra
        free -h

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev \
          python3-pip unzip git patch coreutils curl build-essential cpio wget

    - name: Download Source and Official Toolchain
      run: |
        pip install gdown
        
        # 1. Download and extract Fold 4 source
        gdown "1oIrEQQJuHD8fOWQGEmvFLf1sVCmaZg2-" -O samsung.zip
        unzip samsung.zip
        tar -xf Kernel.tar.gz
        tar -xf Platform.tar.gz
        rm samsung.zip Kernel.tar.gz Platform.tar.gz
        
        # 2. Download and extract Official Samsung Toolchain
        gdown "1z4U2GRukJ5xNRyvKaYj7XLkzdWbG0qnX" -O toolchain.tar.gz
        tar -xf toolchain.tar.gz -C kernel_platform/
        rm toolchain.tar.gz
        
        # 3. Target and Output Fixes
        sed -i 's/BUILD_TARGET=q4q_kor_singlex/BUILD_TARGET=q4q_eur_openx/g' build_kernel_GKI.sh
        mkdir -p out/target/product/q4q/
        mkdir -p out/vendor/qcom/opensource/mmrm-driver/
        touch out/vendor/qcom/opensource/mmrm-driver/Module.symvers

        # 4. EXPERT FIX: Native DTBO Packaging
        find . -type f -name "*.sh" -exec sed -i 's/q4q_kor_\*\.dtbo/*.dtbo/g' {} +
        find . -type f -name "*.sh" -exec sed -i 's/q4q_eur_\*\.dtbo/*.dtbo/g' {} +
        find . -type f -name "build.config*" -exec sed -i 's/q4q_kor_\*\.dtbo/*.dtbo/g' {} +
        find . -type f -name "build.config*" -exec sed -i 's/q4q_eur_\*\.dtbo/*.dtbo/g' {} +

    - name: Setup SUSFS Kernel Patches
      working-directory: kernel_platform/common
      run: |
        git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git \
          -b gki-android12-5.10 /tmp/susfs4ksu
        cp /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/
        cp /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
        cp /tmp/susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/ 2>/dev/null || true
        patch -p1 < /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || true
        
    - name: Setup KernelSU-Next
      working-directory: kernel_platform/common
      run: |
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
        cd drivers/kernelsu
        curl -sL "https://raw.githubusercontent.com/WildKernels/kernel_patches/main/wild/ksun-0daf55582-susfs-v2.1.0-e259e7d6.patch" | patch -p2 || true

    - name: Apply Python KSU/SUSFS Fixes (1-5)
      working-directory: kernel_platform/common/drivers/kernelsu
      run: |
        cat << 'EOF' > ksun_fixes.py
        import re, os
        def fix(path, old, new, label):
            if not os.path.exists(path): return
            with open(path, 'r') as f: s = f.read()
            if old not in s: return
            with open(path, 'w') as f: f.write(s.replace(old, new, 1))
            print(f"✅ {label}")

        # Fix 1 & 4: core/init.c
        path_init = 'core/init.c'
        if os.path.exists(path_init):
            with open(path_init, 'r') as f: s = f.read()
            s = s.replace('bool ksu_late_loaded;\n\n', '').replace('bool ksu_late_loaded;\n', '')
            s = re.sub(r'#if defined\(__x86_64__\)\n.*?#endif\n\n#ifdef MODULE\n\tksu_late_loaded = \(current->pid != 1\);\n#else\n\tksu_late_loaded = false;\n#endif\n\n', '', s, flags=re.DOTALL)
            if 'ksu_sucompat_init' in s and '"feature/sucompat.h"' not in s:
                s = s.replace('#include "ksu.h"', '#include "ksu.h"\n#include "feature/sucompat.h"')
            if 'ksu_setuid_hook_init' in s and '"hook/setuid_hook.h"' not in s:
                s = s.replace('#include "ksu.h"', '#include "ksu.h"\n#include "hook/setuid_hook.h"')
            with open(path_init, 'w') as f: f.write(s)

        # Fix 2, 3, 5
        fix('supercall/supercall.c', '#include <linux/version.h>', '#include <linux/version.h>\n#include <linux/syscalls.h>', 'ksys_close fix')
        fix('selinux/selinux.c', '#include "ksu.h"', '#include "ksu.h"\n#include "security.h"\n\nbool ksu_selinux_hide_running __read_mostly = false;\nstruct selinux_state fake_state;', 'selinux fix')
        fix('hook/setuid_hook.c', '#include <linux/susfs_def.h>', '#include <linux/susfs_def.h>\nstatic inline bool is_zygote_normal_app_uid(uid_t uid) { return uid >= 10000 && uid < 99999; }\nstatic inline void ksu_handle_extra_susfs_work(void) { }', 'Fix 5: missing functions')
        EOF
        python3 ksun_fixes.py

    - name: Patch Defconfigs
      run: |
        STOCK_CONFIG="configs/stock_config.txt"
        printf '%s\n' \
          'CONFIG_UH=n' 'CONFIG_UH_RKP=n' 'CONFIG_UH_LKMAUTH=n' 'CONFIG_UH_LKM_BLOCK=n' \
          'CONFIG_RKP_CFP_JOPP=n' 'CONFIG_RKP_CFP_ROPP=n' 'CONFIG_RKP_CFP=n' \
          'CONFIG_SECURITY_DEFEX=n' 'CONFIG_PROCA=n' 'CONFIG_FIVE=n' \
          'CONFIG_LTO_CLANG_THIN=y' 'CONFIG_LTO_CLANG_FULL=n' 'CONFIG_LTO_NONE=n' \
          'CONFIG_KALLSYMS=y' 'CONFIG_KALLSYMS_ALL=y' 'CONFIG_KPROBES=y' \
          'CONFIG_HAVE_KPROBES=y' 'CONFIG_KPROBE_EVENTS=y' 'CONFIG_OVERLAY_FS=y' \
          'CONFIG_SUSFS=y' 'CONFIG_KSU_SUSFS=y' 'CONFIG_KSU_SUSFS_SUS_PATH=y' \
          'CONFIG_KSU_SUSFS_SUS_MOUNT=y' 'CONFIG_KSU_SUSFS_SUS_KSTAT=y' \
          'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' 'CONFIG_KSU_SUSFS_ENABLE_LOG=y' \
          'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' 'CONFIG_KSU_SUSFS_TRY_UMOUNT=y' \
          'CONFIG_KSU_SUSFS_SUS_SU=n' 'CONFIG_KSU_SUSFS_SUS_MAP=y' \
          > /tmp/ksu_overrides.txt

        # 1. Replace GKI base
        find kernel_platform -type f -name "gki_defconfig" | while read -r config; do
          chmod u+w "$config"
          cp "$STOCK_CONFIG" "$config"
          cat /tmp/ksu_overrides.txt >> "$config"
        done

        # 2. Append to all others
        find kernel_platform -type f \( -name "*.config" -o -name "*defconfig*" -o -name "lego.config" \) | while read -r config; do
          chmod u+w "$config"
          cat /tmp/ksu_overrides.txt >> "$config"
        done

    - name: Build kernel
      run: |
        sed -i 's/TOOL_ARGS+=("LLVM=1")/TOOL_ARGS+=("LLVM=1" "HOSTCC=gcc" "HOSTCXX=g++" "HOSTCFLAGS=-I\/usr\/include -I\/usr\/include\/x86_64-linux-gnu" "HOSTLDFLAGS=-L\/usr\/lib\/x86_64-linux-gnu")/' \
          kernel_platform/build/build.sh
        export LTO=thin
        bash build_kernel_GKI.sh || true

    - name: Upload Image
      run: |
        IMAGE=$(find out/msm-waipio-waipio-gki -name "Image" -not -name "*.lz4" | head -n 1)
        if [ -f "$IMAGE" ]; then
          mkdir -p artifacts && cp "$IMAGE" artifacts/Image
        fi

    - name: Upload to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Fold4-Kernel-KSU-Next
        path: artifacts/

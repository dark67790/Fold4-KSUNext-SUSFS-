name: Build Fold4 Kernel (Native Google Toolchain)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space & Create Swap
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/lib/jvm /usr/share/swift
        sudo apt-get clean
        sudo dd if=/dev/zero of=/swapfile-extra bs=1M count=12288 status=progress
        sudo chmod 600 /swapfile-extra
        sudo mkswap /swapfile-extra
        sudo swapon /swapfile-extra

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev python3-pip unzip git patch coreutils curl build-essential cpio wget

    - name: Download and Extract Samsung Source
      run: |
        pip install gdown
        gdown 1TjP4Sr-yJuZ4sZ69Fo1KWNh_sVn_jN2M -O samsung.zip
        unzip samsung.zip
        tar -xf Kernel.tar.gz
        tar -xf Platform.tar.gz
        rm samsung.zip Kernel.tar.gz Platform.tar.gz

    - name: Download OFFICIAL Google Prebuilts
      run: |
        cd kernel_platform
        
        # 1. Clang
        mkdir -p prebuilts-master/clang/host/linux-x86/clang-r416183b
        curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/bd96dfe349c962681f0e5388af874c771ef96670/clang-r416183b.tar.gz" | tar -xz -C prebuilts-master/clang/host/linux-x86/clang-r416183b
        
        # 2. GAS Assembler
        mkdir -p prebuilts/gas/linux-x86
        curl -LSs "https://android.googlesource.com/platform/prebuilts/gas/linux-x86/+archive/refs/heads/master.tar.gz" | tar -xz -C prebuilts/gas/linux-x86
        
        # 3. Kernel Build Tools (FIXED URL: Provides ufdt_apply_overlay, mktemp, etc)
        git clone --depth=1 https://android.googlesource.com/kernel/prebuilts/build-tools prebuilts/kernel-build-tools
        
        # 4. GCC Host & Sysroot (Provides stdio.h, crt1.o, and the native sysroot)
        mkdir -p prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8 prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8

    - name: Setup KernelSU-Next
      working-directory: kernel_platform/common
      run: |
        chmod -R u+w .
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

    - name: Source Surgery RKP Fix
      run: |
        GAF_FILE="kernel_platform/common/security/samsung/proca/gaf/gaf_v6.c"
        if [ -f "$GAF_FILE" ]; then
          chmod u+w "$GAF_FILE"
          sed -i 's/\.task_struct_integrity = OFFSETOF_INTEGRITY,/#ifdef CONFIG_RKP\n\t.task_struct_integrity = OFFSETOF_INTEGRITY,\n#endif/g' "$GAF_FILE"
          sed -i 's/\.cred_integrity = OFFSETOF_CRED_INTEGRITY,/#ifdef CONFIG_RKP\n\t.cred_integrity = OFFSETOF_CRED_INTEGRITY,\n#endif/g' "$GAF_FILE"
        fi

    - name: Patch Defconfigs (Clean Merge Method)
      run: |
        FLAGS=(
          "CONFIG_SECURITY_DEFEX"
          "CONFIG_PROCA"
          "CONFIG_FIVE"
          "CONFIG_UH"
          "CONFIG_RKP"
          "CONFIG_KDP"
          "CONFIG_KDP_CRED"
          "CONFIG_KDP_NS"
          "CONFIG_KDP_TEST"
          "CONFIG_RKP_TEST"
          "CONFIG_KNOX_KAP"
          "CONFIG_DEBUG_INFO_BTF"
          "CONFIG_SEC_DEBUG_AP_CONTEXT"
        )
        
        find kernel_platform -type f \( -name "*defconfig" -o -name "*.config" \) | while read -r config; do
          chmod u+w "$config" 2>/dev/null || true
          for flag in "${FLAGS[@]}"; do
            sed -i "s/.*${flag}.*/# ${flag} is not set/g" "$config"
          done
          
          # Clean existing KSU entries to prevent merge conflicts
          sed -i '/CONFIG_KPROBES/d' "$config"
          sed -i '/CONFIG_HAVE_KPROBES/d' "$config"
          sed -i '/CONFIG_KPROBE_EVENTS/d' "$config"
          sed -i '/CONFIG_OVERLAY_FS/d' "$config"
        done
        
        # Add KSU flags to the base config
        GKI_CONF="kernel_platform/common/arch/arm64/configs/gki_defconfig"
        echo "CONFIG_KPROBES=y" >> "$GKI_CONF"
        echo "CONFIG_HAVE_KPROBES=y" >> "$GKI_CONF"
        echo "CONFIG_KPROBE_EVENTS=y" >> "$GKI_CONF"
        echo "CONFIG_OVERLAY_FS=y" >> "$GKI_CONF"

    - name: Build kernel
      run: |
        mkdir -p out/vendor/qcom/opensource/mmrm-driver/
        touch out/vendor/qcom/opensource/mmrm-driver/Module.symvers
        mkdir -p out/target/product/q4q/
        
        # Spoof Global Variant
        sed -i 's/BUILD_TARGET=.*/BUILD_TARGET=q4q_eur_openx/g' build_kernel_GKI.sh
        
        # Assassinate the config-checker script
        find . -type f -name "*.sh" -exec sed -i 's/check_merged_defconfig/true/g' {} +
        
        export LTO=thin
        bash build_kernel_GKI.sh

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: Fold4-KSUNext-Image
        path: kernel_platform/out/msm-waipio-waipio-gki/dist/Image*

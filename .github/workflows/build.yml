name: Build Fold4 Kernel (KSU-Next)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Maximize Build Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf /usr/lib/jvm
        df -h

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev python3-pip unzip git patch \
        coreutils curl clang lld llvm build-essential gcc gcc-multilib libcap-dev binutils

    - name: Download and Extract Samsung Source
      run: |
        pip install gdown
        gdown 1TjP4Sr-yJuZ4sZ69Fo1KWNh_sVn_jN2M -O samsung.zip
        unzip samsung.zip
        tar -xf Kernel.tar.gz
        tar -xf Platform.tar.gz
        rm samsung.zip Kernel.tar.gz Platform.tar.gz

    - name: Setup Google Clang and Build Tools
      run: |
        CLANG_DIR="kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b"
        mkdir -p "$CLANG_DIR"
        curl -LSs https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r34/clang-r416183b.tar.gz -o clang.tar.gz
        tar -xf clang.tar.gz -C "$CLANG_DIR"
        rm clang.tar.gz
        TOOL_PATH="kernel_platform/build/build-tools/path/linux-x86"
        mkdir -p "$TOOL_PATH"
        ln -sf /usr/bin/* "$TOOL_PATH/" 2>/dev/null || true
        ln -sf /bin/* "$TOOL_PATH/" 2>/dev/null || true

    - name: Setup KernelSU-Next
      working-directory: kernel_platform/common
      run: |
        chmod -R u+w .
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

    - name: Disable Samsung Security
      working-directory: kernel_platform/common/arch/arm64/configs
      run: |
        chmod +w gki_defconfig
        sed -i 's/CONFIG_SECURITY_DEFEX=y/CONFIG_SECURITY_DEFEX=n/g' gki_defconfig
        sed -i 's/CONFIG_RKP=y/CONFIG_RKP=n/g' gki_defconfig
        sed -i 's/CONFIG_PROCA=y/CONFIG_PROCA=n/g' gki_defconfig
        sed -i 's/CONFIG_KNOX_KAP=y/CONFIG_KNOX_KAP=n/g' gki_defconfig
        sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' gki_defconfig
        {
          echo "CONFIG_KPROBES=y"
          echo "CONFIG_HAVE_KPROBES=y"
          echo "CONFIG_KPROBE_EVENTS=y"
          echo "CONFIG_OVERLAY_FS=y"
        } >> gki_defconfig

    - name: Build kernel
      run: |
        mkdir -p out/target/product/q4q/
        sed -i 's/make LLVM=1 LLVM_IAS=1/make HOSTCC=gcc HOSTCXX=g++ HOSTLD=ld LLVM=1 LLVM_IAS=1/g' \
          kernel_platform/build/build.sh
        chmod +x build_kernel_GKI.sh
        ./build_kernel_GKI.sh

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: Samsung-Fold4-KSUNext-Image
        path: kernel_platform/out/msm-waipio-waipio-gki/dist/Image

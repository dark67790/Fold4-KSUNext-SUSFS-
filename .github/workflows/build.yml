name: Build Fold4 Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev python3-pip unzip git patch coreutils
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 12
        sudo apt install -y clang-12 lld-12 llvm-12

    - name: Download and Extract Samsung Source
      run: |
        pip install gdown
        gdown 1TjP4Sr-yJuZ4sZ69Fo1KWNh_sVn_jN2M -O samsung.zip
        unzip samsung.zip
        tar -xf Kernel.tar.gz
        tar -xf Platform.tar.gz

    - name: Setup build tools
      run: |
        mkdir -p kernel_platform/build/build-tools/path/linux-x86
        for cmd in nproc readlink sed tr make sh bash python3 grep awk find xargs zip unzip; do
          ln -sf $(which $cmd) kernel_platform/build/build-tools/path/linux-x86/$cmd 2>/dev/null || true
        done
        mkdir -p kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin
        for cmd in clang-12 clang++-12 llvm-ar-12 llvm-nm-12 llvm-objcopy-12 llvm-objdump-12 llvm-strip-12 ld.lld-12; do
          base=$(echo $cmd | sed 's/-12//')
          ln -sf $(which $cmd) kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/$base 2>/dev/null || true
        done

    - name: Setup KernelSU-Next + SUSFS
      run: |
        sudo chmod -R 777 kernel_platform/common/
        cd kernel_platform/common
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/main/kernel/setup.sh" | bash -
        wget -q https://raw.githubusercontent.com/simonpunk/susfs4ksu/main/kernel_patches/5.10/50_add_susfs_in_gki-android12-5.10.patch
        patch -p1 --forward --reject-file=/dev/null < 50_add_susfs_in_gki-android12-5.10.patch || echo "SUSFS patch done"

    - name: Build kernel
      run: |
        bash build_kernel_GKI.sh

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel-Image
        path: kernel_platform/out/msm-waipio-waipio-gki/dist/Image

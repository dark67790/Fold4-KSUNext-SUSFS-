name: Build Fold4 Kernel (KSU-Next)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space and Create 12GB Swap
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo rm -rf "/usr/local/share/boost" /usr/lib/jvm /usr/share/swift
        sudo apt-get clean
        
        # Creating a 12GB swap file using dd to avoid "Text file busy" errors
        sudo dd if=/dev/zero of=/swapfile-extra bs=1M count=12288 status=progress
        sudo chmod 600 /swapfile-extra
        sudo mkswap /swapfile-extra
        sudo swapon /swapfile-extra
        free -h

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev \
          python3-pip unzip git patch coreutils curl build-essential cpio wget jq

    - name: Download and Extract Samsung Source
      run: |
        pip install gdown
        gdown 1TjP4Sr-yJuZ4sZ69Fo1KWNh_sVn_jN2M -O samsung.zip
        unzip samsung.zip
        tar -xf Kernel.tar.gz
        tar -xf Platform.tar.gz
        rm samsung.zip Kernel.tar.gz Platform.tar.gz

    - name: Download Clang and GAS
      run: |
        cd kernel_platform
        mkdir -p prebuilts-master/clang/host/linux-x86/clang-r416183b
        curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/bd96dfe349c962681f0e5388af874c771ef96670/clang-r416183b.tar.gz" -o clang.tar.gz
        tar -xzf clang.tar.gz -C prebuilts-master/clang/host/linux-x86/clang-r416183b
        rm clang.tar.gz
        mkdir -p prebuilts/gas/linux-x86
        curl -LSs "https://android.googlesource.com/platform/prebuilts/gas/linux-x86/+archive/refs/heads/master.tar.gz" -o gas.tar.gz
        tar -xzf gas.tar.gz -C prebuilts/gas/linux-x86
        rm gas.tar.gz

    - name: Setup Host Tools and Sysroot
      run: |
        chmod -R u+w kernel_platform/build
        TOOLS_DIR=$(pwd)/kernel_platform/build/build-tools/path/linux-x86
        mkdir -p "$TOOLS_DIR"
        find /usr/bin /bin -maxdepth 1 \( -type f -o -type l \) -executable -exec ln -sf {} "$TOOLS_DIR/" \;
        rm -f "$TOOLS_DIR/gcc" "$TOOLS_DIR/g++" "$TOOLS_DIR/gcc-"* "$TOOLS_DIR/g++-"* "$TOOLS_DIR/cc" "$TOOLS_DIR/c++"

        SYSROOT=$(pwd)/kernel_platform/build/build-tools/sysroot
        rm -rf "$SYSROOT"
        mkdir -p "$SYSROOT/usr/include" "$SYSROOT/usr/lib" "$SYSROOT/lib64"
        cp -a /usr/include/. "$SYSROOT/usr/include/"
        cp -a /usr/lib/x86_64-linux-gnu/. "$SYSROOT/usr/lib/"
        ln -sf /lib/x86_64-linux-gnu "$SYSROOT/lib64"

        if [ -f kernel_platform/build/_setup_env.sh ]; then
          chmod u+w kernel_platform/build/_setup_env.sh
          echo 'export PATH=$PATH:/usr/bin:/bin' >> kernel_platform/build/_setup_env.sh
        fi

    - name: Setup KernelSU-Next
      working-directory: kernel_platform/common
      run: |
        chmod -R u+w .
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

    - name: RKP Source Fix
      run: |
        GAF_FILE="kernel_platform/common/security/samsung/proca/gaf/gaf_v6.c"
        if [ -f "$GAF_FILE" ]; then
          chmod u+w "$GAF_FILE"
          sed -i 's/\.task_struct_integrity = OFFSETOF_INTEGRITY,/#ifdef CONFIG_RKP\n\t.task_struct_integrity = OFFSETOF_INTEGRITY,\n#endif/g' "$GAF_FILE"
          sed -i 's/\.cred_integrity = OFFSETOF_CRED_INTEGRITY,/#ifdef CONFIG_RKP\n\t.cred_integrity = OFFSETOF_CRED_INTEGRITY,\n#endif/g' "$GAF_FILE"
        fi

    - name: Patch Defconfigs
      run: |
        FLAGS=(
          "CONFIG_SECURITY_DEFEX" "CONFIG_PROCA" "CONFIG_FIVE" "CONFIG_UH"
          "CONFIG_RKP" "CONFIG_KDP" "CONFIG_KDP_CRED" "CONFIG_KDP_NS"
          "CONFIG_KNOX_KAP" "CONFIG_LTO" "CONFIG_LTO_CLANG"
          "CONFIG_LTO_CLANG_THIN" "CONFIG_LTO_CLANG_FULL" "CONFIG_DEBUG_INFO_BTF"
        )
        find kernel_platform/common -type f -name "*defconfig" | while read -r config; do
          chmod u+w "$config" 2>/dev/null || true
          for flag in "${FLAGS[@]}"; do
            sed -i "s/${flag}=y/# ${flag} is not set/g" "$config"
          done
          # Force Thin LTO and KSU support
          echo "CONFIG_LTO_CLANG=y" >> "$config"
          echo "CONFIG_LTO_CLANG_THIN=y" >> "$config"
          echo "CONFIG_KPROBES=y" >> "$config"
          echo "CONFIG_HAVE_KPROBES=y" >> "$config"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$config"
          echo "CONFIG_OVERLAY_FS=y" >> "$config"
        done

    - name: Build Kernel
      run: |
        sed -i \
          's|TOOL_ARGS+=("LLVM=1")|TOOL_ARGS+=("LLVM=1" "HOSTCFLAGS=-I/usr/include -I/usr/include/x86_64-linux-gnu" "HOSTLDFLAGS=-L/usr/lib/x86_64-linux-gnu")|' \
          kernel_platform/build/build.sh

        export KMI_SYMBOL_LIST_STRICT_MODE=0
        export SKIP_MRPROPER=1
        export LTO=thin

        cd kernel_platform
        BUILD_CONFIG=common/build.config.gki.aarch64 ./build/build.sh

    - name: Prepare Artifacts
      run: |
        mkdir -p final_out
        # Grabbing everything starting with "Image" from the out dir
        find kernel_platform/out/android12-5.10/ -name "Image*" -exec cp {} final_out/ \;
        echo "Artifacts ready:"
        ls -lh final_out/

    - name: Upload to GoFile
      run: |
        # Use jq to pick the best server
        SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
        echo "Uploading to GoFile server: $SERVER"
        for file in final_out/*; do
          RESPONSE=$(curl -F "file=@$file" "https://$SERVER.gofile.io/contents/uploadfile")
          DOWNLOAD_LINK=$(echo $RESPONSE | jq -r '.data.downloadPage')
          echo "--------------------------------------------------"
          echo "✅ File: $(basename $file)"
          echo "🔗 Link: $DOWNLOAD_LINK"
          echo "--------------------------------------------------"
        done

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: build-${{ github.run_id }}
        name: Fold4 Thin-LTO Build ${{ github.run_id }}
        files: final_out/*
        body: "Fold4 Kernel with KernelSU-Next and Thin LTO enabled."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Fold4-Kernel-ThinLTO
        path: final_out/*

name: Build Fold4 Kernel (KSU-Next + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space and Create Swap
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo rm -rf "/usr/local/share/boost" /usr/lib/jvm /usr/share/swift
        sudo apt-get clean
        sudo dd if=/dev/zero of=/swapfile-extra bs=1M count=12288 status=progress
        sudo chmod 600 /swapfile-extra
        sudo mkswap /swapfile-extra
        sudo swapon /swapfile-extra
        free -h

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev \
          python3-pip unzip git patch coreutils curl build-essential cpio wget

    - name: Download and Extract Samsung Source
      run: |
        pip install gdown
        gdown "1oIrEQQJuHD8fOWQGEmvFLf1sVCmaZg2-" -O samsung.zip
        unzip samsung.zip
        tar -xf Kernel.tar.gz
        tar -xf Platform.tar.gz
        rm samsung.zip Kernel.tar.gz Platform.tar.gz

    - name: Patch Build Target
      run: |
        sed -i 's/BUILD_TARGET=q4q_kor_singlex/BUILD_TARGET=q4q_eur_openx/g' \
          build_kernel_GKI.sh
        grep "BUILD_TARGET" build_kernel_GKI.sh

    - name: Download Clang and GAS
      run: |
        cd kernel_platform
        mkdir -p prebuilts-master/clang/host/linux-x86/clang-r416183b
        curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/bd96dfe349c962681f0e5388af874c771ef96670/clang-r416183b.tar.gz" -o clang.tar.gz
        tar -xzf clang.tar.gz -C prebuilts-master/clang/host/linux-x86/clang-r416183b
        rm clang.tar.gz
        mkdir -p prebuilts/gas/linux-x86
        curl -LSs "https://android.googlesource.com/platform/prebuilts/gas/linux-x86/+archive/refs/heads/master.tar.gz" -o gas.tar.gz
        tar -xzf gas.tar.gz -C prebuilts/gas/linux-x86
        rm gas.tar.gz

    - name: Setup Host Tools and Sysroot
      run: |
        chmod -R u+w kernel_platform/build
        TOOLS_DIR=$(pwd)/kernel_platform/build/build-tools/path/linux-x86
        mkdir -p "$TOOLS_DIR"
        find /usr/bin /bin -maxdepth 1 -type f -executable -exec ln -sf {} "$TOOLS_DIR/" \;
        rm -f "$TOOLS_DIR/gcc" "$TOOLS_DIR/g++"
        printf '#!/bin/bash\nexec /usr/bin/gcc -I/usr/include -I/usr/include/x86_64-linux-gnu "$@"\n' > "$TOOLS_DIR/gcc"
        printf '#!/bin/bash\nexec /usr/bin/g++ -I/usr/include -I/usr/include/x86_64-linux-gnu "$@"\n' > "$TOOLS_DIR/g++"
        chmod +x "$TOOLS_DIR/gcc" "$TOOLS_DIR/g++"
        KBT=$(pwd)/kernel_platform/prebuilts/kernel-build-tools/linux-x86/lib64
        mkdir -p "$KBT"
        cp /usr/lib/x86_64-linux-gnu/crt1.o "$KBT/"
        cp /usr/lib/x86_64-linux-gnu/crti.o "$KBT/"
        cp /usr/lib/x86_64-linux-gnu/crtn.o "$KBT/"
        cp /usr/lib/x86_64-linux-gnu/Scrt1.o "$KBT/" 2>/dev/null || true
        ln -sf /usr/lib/x86_64-linux-gnu/libc.so.6 "$KBT/libc.so.6"
        echo "GROUP ( /usr/lib/x86_64-linux-gnu/libc.so.6 /usr/lib/x86_64-linux-gnu/libc_nonshared.a )" > "$KBT/libc.so"
        ln -sf /usr/lib/x86_64-linux-gnu "$KBT/../lib64"
        SYSROOT=$(pwd)/kernel_platform/build/build-tools/sysroot
        rm -rf "$SYSROOT"
        mkdir -p "$SYSROOT/usr"
        ln -sf /usr/include "$SYSROOT/usr/include"
        ln -sf /usr/lib "$SYSROOT/usr/lib"
        ln -sf /lib "$SYSROOT/lib"
        ln -sf /lib64 "$SYSROOT/lib64"
        if [ -f kernel_platform/build/_setup_env.sh ]; then
          echo 'export PATH=$PATH:/usr/bin:/bin' >> kernel_platform/build/_setup_env.sh
        fi

    - name: Setup SUSFS Kernel Patches
      working-directory: kernel_platform/common
      run: |
        git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git \
          -b gki-android12-5.10 /tmp/susfs4ksu

        cp /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/
        cp /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
        cp /tmp/susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/ 2>/dev/null || true

        # Pre-process open.c — remove DEFEX blocks so SUSFS hunk applies cleanly
        sed -i '/#ifdef CONFIG_SECURITY_DEFEX/,/^#endif/d' fs/open.c

        # Pre-process namespace.c — remove KDP_NS conditional so SUSFS hunk applies cleanly
        sed -i '/copy_flags = CL_COPY_UNBINDABLE | CL_EXPIRE;/,/#endif/ {
          /#ifdef CONFIG_KDP_NS/,/#endif/ {
             /#else/,/#endif/!d
             /#else/d
             /#endif/d
          }
        }' fs/namespace.c

        # Apply main SUSFS kernel patch
        patch -p1 < /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || true

        # Apply wild a12-5.10 supplemental patch for proc/base.c
        curl -sL "https://raw.githubusercontent.com/WildKernels/kernel_patches/main/wild/susfs_fix_patches/v2.1.0/a12-5.10/base.c.patch" \
          | patch -p1 || true

        # Fix remaining Samsung-specific rejected hunks
        python3 $GITHUB_WORKSPACE/patches/susfs_hunk_fix.py

        find . -name "*.rej" -delete
        find . -name "*.orig" -delete

    - name: Verify SUSFS Kernel Patches
      working-directory: kernel_platform/common
      run: |
        FAIL=0
        check() {
          local label="$1"; local file="$2"; local pattern="$3"
          if grep -q "$pattern" "$file" 2>/dev/null; then
            echo "✅ $label"
          else
            echo "❌ $label — '$pattern' not found in $file"
            FAIL=1
          fi
        }

        check "susfs.c exists"             fs/susfs.c                      "susfs"
        check "susfs.h exists"             include/linux/susfs.h           "susfs"
        check "susfs_def.h exists"         include/linux/susfs_def.h       "susfs"
        check "fs/Makefile compiles susfs" fs/Makefile                     "susfs.o"
        check "exec.c patched"             fs/exec.c                       "susfs_def.h"
        check "namespace.c SUS_MOUNT"      fs/namespace.c                  "CONFIG_KSU_SUSFS_SUS_MOUNT"
        check "namespace.c externs"        fs/namespace.c                  "susfs_is_current_ksu_domain"
        check "namespace.c copy_flags"     fs/namespace.c                  "CL_COPY_MNT_NS"
        check "open.c patched"             fs/open.c                       "is_inode_open_redirect"
        check "proc/base.c include"        fs/proc/base.c                  "susfs_def.h"
        check "proc/base.c SUS_MAP"        fs/proc/base.c                  "AS_FLAGS_SUS_MAP"
        check "proc/base.c vma declared"   fs/proc/base.c                  "struct vm_area_struct \*vma"
        check "fdinfo.c patched"           fs/notify/fdinfo.c              "DEFAULT_KSU_MNT_ID"
        check "hooks.c ksu_selinux ref"    security/selinux/hooks.c        "ksu_selinux_hide_running"

        REJS=$(find . -name "*.rej" 2>/dev/null)
        if [ -n "$REJS" ]; then
          echo "❌ Leftover .rej files: $REJS"
          FAIL=1
        else
          echo "✅ No leftover .rej files"
        fi

        if [ "$FAIL" -ne 0 ]; then
          echo "❌ SUSFS kernel patch checks failed — aborting"
          exit 1
        fi
        echo "✅ All SUSFS kernel patch checks passed"

    - name: Setup KernelSU-Next with SUSFS
      working-directory: kernel_platform/common
      run: |
        chmod -R u+w .
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
          | bash -s dev

        # Pin to exact commit WildKernels uses
        git -C KernelSU-Next fetch --unshallow 2>/dev/null || true
        git -C KernelSU-Next checkout 551ad80473f60e052917aec08abf5323b6ab2f7c

        # Apply 10_enable_susfs_for_ksu.patch from KernelSU-Next/ with -p1
        # Many hunks fail (original KSU patch) — fix patches below handle them
        cp /tmp/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU-Next/
        cd KernelSU-Next
        patch -p1 --batch < 10_enable_susfs_for_ksu.patch || true
        rm 10_enable_susfs_for_ksu.patch

        # Apply WildKernels v2.1.0 fix patches from KernelSU-Next/ with -p1
        for p in fix_Kbuild fix_Makefile fix_init.c fix_kernel_umount.c \
                  fix_setuid_hook.c fix_sucompat.c fix_sucompat.h \
                  fix_supercall.c ksu_toolkit overwrite_hook_mode; do
          curl -sL "https://raw.githubusercontent.com/WildKernels/kernel_patches/main/next/susfs_fix_patches/v2.1.0/${p}.patch" \
            | patch -p1 --batch || true
        done

        # Run ksun_init_fix.py from drivers/kernelsu (symlink to KernelSU-Next/kernel in CI)
        cd $GITHUB_WORKSPACE/kernel_platform/common/drivers/kernelsu
        python3 $GITHUB_WORKSPACE/patches/ksun_init_fix.py

        find . -name "*.rej" -delete
        find . -name "*.orig" -delete

    - name: Verify KernelSU-Next SUSFS Integration
      working-directory: kernel_platform/common/drivers/kernelsu
      run: |
        FAIL=0
        check() {
          local label="$1"; local file="$2"; local pattern="$3"
          if grep -q "$pattern" "$file" 2>/dev/null; then
            echo "✅ $label"
          else
            echo "❌ $label — '$pattern' not found in $file"
            FAIL=1
          fi
        }

        check "Kconfig has KSU_SUSFS"          Kconfig                          "KSU_SUSFS"
        check "Kconfig has SUS_MOUNT"          Kconfig                          "KSU_SUSFS_SUS_MOUNT"
        check "Kconfig has OPEN_REDIRECT"      Kconfig                          "KSU_SUSFS_OPEN_REDIRECT"
        check "sucompat.c patched"             feature/sucompat.c               "susfs"
        check "selinux hide defined"           selinux/selinux.c                "ksu_selinux_hide_running"
        check "fake_state defined"             selinux/selinux.c                "fake_state"
        check "static keys defined"            runtime/ksud_integration.c       "DEFINE_STATIC_KEY_TRUE"
        check "su_compat_enabled defined"      feature/sucompat.c               "ksu_su_compat_enabled"
        check "supercall syscalls.h"           supercall/supercall.c            "linux/syscalls.h"

        REJS=$(find . -name "*.rej" 2>/dev/null)
        if [ -n "$REJS" ]; then
          echo "❌ Leftover .rej files:"
          echo "$REJS"
          FAIL=1
        else
          echo "✅ No leftover .rej files"
        fi

        if grep -q "ksu_late_loaded" core/init.c 2>/dev/null; then
          echo "❌ init.c still has ksu_late_loaded"
          FAIL=1
        else
          echo "✅ init.c clean"
        fi

        if [ "$FAIL" -ne 0 ]; then
          echo "❌ KSU-Next SUSFS checks failed — aborting"
          exit 1
        fi
        echo "✅ All KSU-Next SUSFS checks passed"

    - name: Patch Defconfigs
      run: |
        STOCK_CONFIG="configs/stock_config.txt"

        printf '%s\n' \
          'CONFIG_UH=n' \
          'CONFIG_UH_RKP=n' \
          'CONFIG_UH_LKMAUTH=n' \
          'CONFIG_UH_LKM_BLOCK=n' \
          'CONFIG_RKP_CFP_JOPP=n' \
          'CONFIG_RKP_CFP=n' \
          'CONFIG_SECURITY_DEFEX=n' \
          'CONFIG_PROCA=n' \
          'CONFIG_FIVE=n' \
          'CONFIG_RKP=n' \
          'CONFIG_KDP_NS=n' \
          'CONFIG_KDP=n' \
          'CONFIG_OVERLAY_FS=y' \
          'CONFIG_TMPFS_XATTR=y' \
          'CONFIG_TMPFS_POSIX_ACL=y' \
          'CONFIG_KPROBES=y' \
          'CONFIG_HAVE_KPROBES=y' \
          'CONFIG_KPROBE_EVENTS=y' \
          'CONFIG_KSU=y' \
          'CONFIG_KSU_WITH_KPROBES=n' \
          'CONFIG_KSU_SUSFS=y' \
          'CONFIG_KSU_SUSFS_SUS_PATH=y' \
          'CONFIG_KSU_SUSFS_SUS_MOUNT=y' \
          'CONFIG_KSU_SUSFS_SUS_KSTAT=y' \
          'CONFIG_KSU_SUSFS_SUS_MAP=y' \
          'CONFIG_KSU_SUSFS_TRY_UMOUNT=y' \
          'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' \
          'CONFIG_KSU_SUSFS_ENABLE_LOG=y' \
          'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' \
          > /tmp/ksu_overrides.txt

        find kernel_platform -type f -name "gki_defconfig" | while read -r config; do
          chmod u+w "$config" 2>/dev/null || true
          cp "$STOCK_CONFIG" "$config"
          cat /tmp/ksu_overrides.txt >> "$config"
          echo "Patched $config with stock base"
        done

        find kernel_platform -type f \( \
          -name "*.config" \
          -o -name "*defconfig*" \
          -o -name "lego.config" \
        \) | while read -r config; do
          chmod u+w "$config" 2>/dev/null || true
          cat /tmp/ksu_overrides.txt >> "$config"
          echo "Appended overrides to $config"
        done

    - name: Build kernel
      run: |
        mkdir -p out/vendor/qcom/opensource/mmrm-driver/
        touch out/vendor/qcom/opensource/mmrm-driver/Module.symvers
        mkdir -p out/target/product/q4q/

        sed -i 's/TOOL_ARGS+=("LLVM=1")/TOOL_ARGS+=("LLVM=1" "HOSTCC=gcc" "HOSTCXX=g++" "HOSTCFLAGS=-I\/usr\/include -I\/usr\/include\/x86_64-linux-gnu -Wno-unused-result" "HOSTLDFLAGS=-L\/usr\/lib\/x86_64-linux-gnu")/' \
          kernel_platform/build/build.sh

        export LTO=thin
        bash build_kernel_GKI.sh || true

    - name: Upload Image to GoFile
      run: |
        IMAGE=$(find out/msm-waipio-waipio-gki -name "Image" -not -name "*.lz4" 2>/dev/null | head -n 1)
        IMAGE_LZ4=$(find out/msm-waipio-waipio-gki -name "Image.lz4" 2>/dev/null | head -n 1)

        if [ ! -f "$IMAGE" ]; then
          echo "❌ Image not found"
          find out/ -name "Image" 2>/dev/null || true
          exit 1
        fi

        echo "✅ Image: $(du -h "$IMAGE")"
        mkdir -p artifacts
        cp "$IMAGE" artifacts/Image
        [ -f "$IMAGE_LZ4" ] && cp "$IMAGE_LZ4" artifacts/Image.lz4

        SERVER=$(curl -s https://api.gofile.io/servers | \
          python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['servers'][0]['name'])")

        RESP=$(curl -s -F "file=@artifacts/Image" "https://$SERVER.gofile.io/uploadFile")
        echo "✅ Image → $(echo $RESP | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['downloadPage'])")"

        if [ -f artifacts/Image.lz4 ]; then
          RESP=$(curl -s -F "file=@artifacts/Image.lz4" "https://$SERVER.gofile.io/uploadFile")
          echo "✅ Image.lz4 → $(echo $RESP | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['downloadPage'])")"
        fi

    - name: Upload to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Fold4-KSUNext-SUSFS
        path: artifacts/

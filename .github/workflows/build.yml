name: Build Fold4 Kernel (V16 - Host Tooling Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space & 12GB Swap
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean
        sudo dd if=/dev/zero of=/swapfile-extra bs=1M count=12288 status=progress
        sudo chmod 600 /swapfile-extra
        sudo mkswap /swapfile-extra
        sudo swapon /swapfile-extra

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev python3-pip unzip git patch coreutils curl build-essential cpio wget gcc-multilib g++-multilib

    - name: Download and Extract
      run: |
        pip install gdown
        gdown 1TjP4Sr-yJuZ4sZ69Fo1KWNh_sVn_jN2M -O samsung.zip
        unzip samsung.zip
        tar -xf Kernel.tar.gz
        tar -xf Platform.tar.gz

    - name: Download Clang and GAS
      run: |
        PLATFORM_DIR=$(find . -maxdepth 2 -type d -name "kernel_platform" | head -n 1)
        cd "$PLATFORM_DIR"
        mkdir -p prebuilts-master/clang/host/linux-x86/clang-r416183b
        curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/bd96dfe349c962681f0e5388af874c771ef96670/clang-r416183b.tar.gz" -o clang.tar.gz
        tar -xzf clang.tar.gz -C prebuilts-master/clang/host/linux-x86/clang-r416183b
        mkdir -p prebuilts/gas/linux-x86
        curl -LSs "https://android.googlesource.com/platform/prebuilts/gas/linux-x86/+archive/refs/heads/master.tar.gz" -o gas.tar.gz
        tar -xzf gas.tar.gz -C prebuilts/gas/linux-x86

    - name: Setup KernelSU-Next
      run: |
        COMMON_DIR=$(find . -maxdepth 3 -type d -name "common" | head -n 1)
        cd "$COMMON_DIR"
        chmod -R u+w .
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

    - name: Source Surgery & Patching
      run: |
        # RKP Fix
        GAF_FILE=$(find . -name "gaf_v6.c" | head -n 1)
        if [ -f "$GAF_FILE" ]; then
          chmod u+w "$GAF_FILE"
          sed -i 's/\.task_struct_integrity = OFFSETOF_INTEGRITY,/#ifdef CONFIG_RKP\n\t.task_struct_integrity = OFFSETOF_INTEGRITY,\n#endif/g' "$GAF_FILE"
          sed -i 's/\.cred_integrity = OFFSETOF_CRED_INTEGRITY,/#ifdef CONFIG_RKP\n\t.cred_integrity = OFFSETOF_CRED_INTEGRITY,\n#endif/g' "$GAF_FILE"
        fi
        # Defconfig patching
        FLAGS=("CONFIG_SECURITY_DEFEX" "CONFIG_PROCA" "CONFIG_FIVE" "CONFIG_UH" "CONFIG_RKP" "CONFIG_KDP" "CONFIG_KDP_CRED" "CONFIG_KDP_NS" "CONFIG_KDP_TEST" "CONFIG_RKP_TEST" "CONFIG_KNOX_KAP" "CONFIG_DEBUG_INFO_BTF")
        find . -type f -name "*defconfig" | while read -r config; do
          chmod u+w "$config" 2>/dev/null || true
          for flag in "${FLAGS[@]}"; do
            sed -i "s/$flag=y/# $flag is not set/g" "$config"
            echo "# $flag is not set" >> "$config"
          done
          echo "CONFIG_KPROBES=y" >> "$config"
          echo "CONFIG_HAVE_KPROBES=y" >> "$config"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$config"
          echo "CONFIG_OVERLAY_FS=y" >> "$config"
        done

    - name: Build Kernel (The Real Fix)
      run: |
        # FIND THE TOOLS DIR
        TOOLS_DIR=$(find . -path "*/build-tools/path/linux-x86" | head -n 1)
        mkdir -p "$TOOLS_DIR"
        # Link every tool into the path
        find /usr/bin /bin -maxdepth 1 -type f -executable -exec ln -sf {} "$TOOLS_DIR/" \;
        
        # KEY FIX: Force the build to use the system's GCC/Linker for Host tools
        # This prevents the 'crt1.o not found' Clang error
        export HOSTCC=gcc
        export HOSTCXX=g++
        export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/lib
        
        # Standard GKI flags
        export LTO=thin
        export PATH="$TOOLS_DIR:$PATH"
        
        # Locate and run build script
        BUILD_SCRIPT=$(find . -name "build_kernel_GKI.sh" | head -n 1)
        cd $(dirname "$BUILD_SCRIPT")
        bash build_kernel_GKI.sh

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Fold4-Fixed-Image
        path: out/**/dist/Image

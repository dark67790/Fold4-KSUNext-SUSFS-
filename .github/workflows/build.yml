name: Build Fold4 Kernel (KSU-Next)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo rm -rf "/usr/local/share/boost" /usr/lib/jvm
        df -h

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev \
          python3-pip unzip git patch coreutils curl build-essential

    - name: Download and Extract Samsung Source
      run: |
        pip install gdown
        gdown 1TjP4Sr-yJuZ4sZ69Fo1KWNh_sVn_jN2M -O samsung.zip
        unzip samsung.zip
        tar -xf Kernel.tar.gz
        tar -xf Platform.tar.gz
        rm samsung.zip Kernel.tar.gz Platform.tar.gz

    - name: Clone Google Clang Prebuilts
      run: |
        git clone --depth=1 \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
          kernel_platform/prebuilts-master/clang/host/linux-x86

    - name: Clone Google Build Tools
      run: |
        git clone --depth=1 --filter=blob:none --sparse \
          https://android.googlesource.com/platform/prebuilts/build-tools \
          kernel_platform/build/build-tools
        cd kernel_platform/build/build-tools
        git sparse-checkout set path/linux-x86
        git checkout

    - name: Clone GAS Assembler
      run: |
        git clone --depth=1 \
          https://android.googlesource.com/platform/prebuilts/gas/linux-x86 \
          kernel_platform/prebuilts/gas/linux-x86

    - name: Setup KernelSU-Next
      working-directory: kernel_platform/common
      run: |
        chmod -R u+w .
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

    - name: Disable Samsung Security
      working-directory: kernel_platform/common/arch/arm64/configs
      run: |
        chmod +w gki_defconfig
        sed -i 's/CONFIG_SECURITY_DEFEX=y/CONFIG_SECURITY_DEFEX=n/g' gki_defconfig
        sed -i 's/CONFIG_RKP=y/CONFIG_RKP=n/g' gki_defconfig
        sed -i 's/CONFIG_PROCA=y/CONFIG_PROCA=n/g' gki_defconfig
        sed -i 's/CONFIG_KNOX_KAP=y/CONFIG_KNOX_KAP=n/g' gki_defconfig
        sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' gki_defconfig
        {
          echo "CONFIG_KPROBES=y"
          echo "CONFIG_HAVE_KPROBES=y"
          echo "CONFIG_KPROBE_EVENTS=y"
          echo "CONFIG_OVERLAY_FS=y"
        } >> gki_defconfig

    - name: Build kernel
      run: |
        mkdir -p out/target/product/q4q/
        bash build_kernel_GKI.sh

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: Samsung-Fold4-KSUNext-Image
        path: kernel_platform/out/msm-waipio-waipio-gki/dist/Image

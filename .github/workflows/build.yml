name: Build Fold4 Kernel (KSU-Next Checkmate)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo rm -rf "/usr/local/share/boost" /usr/lib/jvm
        df -h

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev \
          python3-pip unzip git patch coreutils curl build-essential cpio wget

    - name: Download and Extract Samsung Source
      run: |
        pip install gdown
        gdown 1TjP4Sr-yJuZ4sZ69Fo1KWNh_sVn_jN2M -O samsung.zip
        unzip samsung.zip
        tar -xf Kernel.tar.gz
        tar -xf Platform.tar.gz
        rm samsung.zip Kernel.tar.gz Platform.tar.gz

    - name: Download Clang and GAS
      run: |
        cd kernel_platform
        
        # 1. Clang (r416183b as requested by your log)
        mkdir -p prebuilts-master/clang/host/linux-x86/clang-r416183b
        curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/bd96dfe349c962681f0e5388af874c771ef96670/clang-r416183b.tar.gz" -o clang.tar.gz
        tar -xzf clang.tar.gz -C prebuilts-master/clang/host/linux-x86/clang-r416183b
        rm clang.tar.gz
        
        # 2. GAS Assembler
        mkdir -p prebuilts/gas/linux-x86
        curl -LSs "https://android.googlesource.com/platform/prebuilts/gas/linux-x86/+archive/refs/heads/master.tar.gz" -o gas.tar.gz
        tar -xzf gas.tar.gz -C prebuilts/gas/linux-x86
        rm gas.tar.gz

    - name: Defeat Hermetic Environment
      run: |
        TOOLS_DIR=$(pwd)/kernel_platform/build/build-tools/path/linux-x86
        mkdir -p "$TOOLS_DIR"
        
        # 1. Dump every Ubuntu executable into the Hermetic folder as a symlink
        # This completely neutralizes the "command not found" issue without downloading broken wrappers
        find /usr/bin /bin -maxdepth 1 -type f -executable -exec ln -sf {} "$TOOLS_DIR/" \;
        
        # 2. Add our GCC/G++ wrappers to fix --rtlib errors
        rm -f "$TOOLS_DIR/gcc" "$TOOLS_DIR/g++"
        printf '#!/bin/bash\nargs=()\nfor arg in "$@"; do\n  case "$arg" in\n    --rtlib=*|--unwindlib=*) ;;\n    *) args+=("$arg") ;;\n  esac\ndone\nexec /usr/bin/gcc "${args[@]}"\n' > "$TOOLS_DIR/gcc"
        printf '#!/bin/bash\nargs=()\nfor arg in "$@"; do\n  case "$arg" in\n    --rtlib=*|--unwindlib=*) ;;\n    *) args+=("$arg") ;;\n  esac\ndone\nexec /usr/bin/g++ "${args[@]}"\n' > "$TOOLS_DIR/g++"
        chmod +x "$TOOLS_DIR/gcc" "$TOOLS_DIR/g++"

        # 3. Aggressively patch Samsung's _setup_env.sh to ensure our system PATH survives
        if [ -f kernel_platform/build/_setup_env.sh ]; then
          echo 'export PATH=$PATH:/usr/bin:/bin:/usr/local/bin' >> kernel_platform/build/_setup_env.sh
        fi

    - name: Setup KernelSU-Next
      working-directory: kernel_platform/common
      run: |
        chmod -R u+w .
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

    - name: Patch Defconfig
      working-directory: kernel_platform/common/arch/arm64/configs
      run: |
        chmod +w gki_defconfig
        sed -i 's/CONFIG_SECURITY_DEFEX=y/CONFIG_SECURITY_DEFEX=n/g' gki_defconfig
        sed -i 's/CONFIG_RKP=y/CONFIG_RKP=n/g' gki_defconfig
        sed -i 's/CONFIG_PROCA=y/CONFIG_PROCA=n/g' gki_defconfig
        sed -i 's/CONFIG_KNOX_KAP=y/CONFIG_KNOX_KAP=n/g' gki_defconfig
        sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' gki_defconfig
        printf 'CONFIG_KPROBES=y\nCONFIG_HAVE_KPROBES=y\nCONFIG_KPROBE_EVENTS=y\nCONFIG_OVERLAY_FS=y\n' >> gki_defconfig

    - name: Build
      run: |
        # Fix for MMRM driver requirements
        mkdir -p out/vendor/qcom/opensource/mmrm-driver/
        touch out/vendor/qcom/opensource/mmrm-driver/Module.symvers
        
        # Instruct build.sh to use our GCC wrappers for host tooling
        sed -i 's/TOOL_ARGS+=("LLVM=1")/TOOL_ARGS+=("LLVM=1" "HOSTCC=gcc" "HOSTCXX=g++")/' kernel_platform/build/build.sh
        
        bash build_kernel_GKI.sh

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: Fold4-KSUNext-Image
        path: out/msm-waipio-waipio-gki/dist/Image

name: Build Fold4 Kernel (KSU-Next)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo rm -rf "/usr/local/share/boost" /usr/lib/jvm
        df -h

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev \
          python3-pip unzip git patch coreutils curl build-essential

    - name: Download and Extract Samsung Source
      run: |
        pip install gdown
        gdown 1TjP4Sr-yJuZ4sZ69Fo1KWNh_sVn_jN2M -O samsung.zip
        unzip samsung.zip
        tar -xf Kernel.tar.gz
        tar -xf Platform.tar.gz
        rm samsung.zip Kernel.tar.gz Platform.tar.gz

    - name: Setup Google Hermetic Build Environment
      run: |
        # 1. Google Clang 12.0.5 Toolchain
        mkdir -p kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b
        cd kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b
        curl -Lo clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r416183b.tar.gz
        tar -xf clang.tar.gz
        rm clang.tar.gz
        cd ../../../../../..

        # 2. Google Kernel Build Tools (Fixed 404 URL)
        rm -rf kernel_platform/build/build-tools
        git clone --depth=1 https://android.googlesource.com/kernel/prebuilts/build-tools kernel_platform/build/build-tools

        # 3. Google GLIBC Sysroot
        mkdir -p kernel_platform/prebuilts/gcc/linux-x86/host
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8 kernel_platform/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8

        # 4. Google GAS Assembler (Fixed 404 URL)
        mkdir -p kernel_platform/prebuilts/gas/linux-x86
        git clone --depth=1 https://android.googlesource.com/kernel/prebuilts/gas/linux-x86 kernel_platform/prebuilts/gas/linux-x86

    - name: Setup KernelSU-Next
      working-directory: kernel_platform/common
      run: |
        chmod -R u+w .
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

    - name: Disable Samsung Security
      working-directory: kernel_platform/common/arch/arm64/configs
      run: |
        chmod +w gki_defconfig
        sed -i 's/CONFIG_SECURITY_DEFEX=y/CONFIG_SECURITY_DEFEX=n/g' gki_defconfig
        sed -i 's/CONFIG_RKP=y/CONFIG_RKP=n/g' gki_defconfig
        sed -i 's/CONFIG_PROCA=y/CONFIG_PROCA=n/g' gki_defconfig
        sed -i 's/CONFIG_KNOX_KAP=y/CONFIG_KNOX_KAP=n/g' gki_defconfig
        sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' gki_defconfig
        {
          echo "CONFIG_KPROBES=y"
          echo "CONFIG_HAVE_KPROBES=y"
          echo "CONFIG_KPROBE_EVENTS=y"
          echo "CONFIG_OVERLAY_FS=y"
        } >> gki_defconfig

    - name: Build kernel
      run: |
        # Ensure the prebuilt tools are in the PATH for the Samsung script
        export PATH=$(pwd)/kernel_platform/build/build-tools/path/linux-x86:$PATH
        mkdir -p out/target/product/q4q/
        bash build_kernel_GKI.sh

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: Samsung-Fold4-KSUNext-Image
        path: kernel_platform/out/msm-waipio-waipio-gki/dist/Image

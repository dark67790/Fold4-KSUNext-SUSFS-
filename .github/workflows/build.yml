name: Build Fold4 Kernel (KSU-Next)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev python3-pip unzip git patch coreutils curl clang lld llvm build-essential

    - name: Download and Extract Samsung Source
      run: |
        pip install gdown
        gdown 1TjP4Sr-yJuZ4sZ69Fo1KWNh_sVn_jN2M -O samsung.zip
        unzip samsung.zip
        # Using -f to prevent prompts if files already exist
        tar -xf Kernel.tar.gz
        tar -xf Platform.tar.gz

    - name: Setup Official Google Build Tools (Clang-r416183b)
      run: |
        # Create directory and download Clang
        mkdir -p kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b
        curl -LSs https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r34/clang-r416183b.tar.gz -o clang.tar.gz
        tar -xf clang.tar.gz -C kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b
        
        # Link system binaries to satisfy hermetic build requirements
        mkdir -p kernel_platform/build/build-tools/path/linux-x86
        ln -sf /usr/bin/* kernel_platform/build/build-tools/path/linux-x86/ 2>/dev/null || true
        ln -sf /bin/* kernel_platform/build/build-tools/path/linux-x86/ 2>/dev/null || true

    - name: Setup KernelSU-Next
      working-directory: kernel_platform/common
      run: |
        # Make files writable
        chmod -R u+w .
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

    - name: Lobotomize Samsung Security (Defex/RKP/Proca)
      working-directory: kernel_platform/common/arch/arm64/configs
      run: |
        chmod +w gki_defconfig
        # Turn off Samsung Security
        sed -i 's/CONFIG_SECURITY_DEFEX=y/CONFIG_SECURITY_DEFEX=n/g' gki_defconfig
        sed -i 's/CONFIG_RKP=y/CONFIG_RKP=n/g' gki_defconfig
        sed -i 's/CONFIG_PROCA=y/CONFIG_PROCA=n/g' gki_defconfig
        sed -i 's/CONFIG_KNOX_KAP=y/CONFIG_KNOX_KAP=n/g' gki_defconfig
        
        # Ensure Kprobes is enabled for KSU
        {
          echo "CONFIG_KPROBES=y"
          echo "CONFIG_HAVE_KPROBES=y"
          echo "CONFIG_KPROBE_EVENTS=y"
        } >> gki_defconfig

    - name: Build kernel
      run: |
        # Fix the mktemp missing directory warning
        mkdir -p out/target/product/q4q/
        chmod +x build_kernel_GKI.sh
        # Pathing might be strict, ensure the script is executed in the root or appropriate folder
        ./build_kernel_GKI.sh

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: Samsung-Fold4-KSUNext-Image
        path: kernel_platform/out/msm-waipio-waipio-gki/dist/Image

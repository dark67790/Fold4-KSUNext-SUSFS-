name: Build Fold4 Kernel (KSU-Next + SUSFS Auto-Kang)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev python3-pip unzip git patch coreutils curl clang lld llvm

    - name: Download and Extract Samsung Source
      run: |
        pip install gdown
        gdown 1TjP4Sr-yJuZ4sZ69Fo1KWNh_sVn_jN2M -O samsung.zip
        unzip samsung.zip
        tar -xf Kernel.tar.gz
        tar -xf Platform.tar.gz

    - name: Setup Official Google Build Tools
      run: |
        mkdir -p kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b
        cd kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r34/clang-r416183b.tar.gz
        tar -xf clang-r416183b.tar.gz
        cd ../../../../../..
        
        # Sledgehammer host tools fix
        mkdir -p kernel_platform/build/build-tools/path/linux-x86
        ln -sf /usr/bin/* kernel_platform/build/build-tools/path/linux-x86/ 2>/dev/null || true
        ln -sf /bin/* kernel_platform/build/build-tools/path/linux-x86/ 2>/dev/null || true

    - name: Clone the Kang Repository (BruhDudeWew)
      run: |
        # Clone the fixed Samsung 5.10.226 repo to a temp folder so we can steal his fixed files!
        git clone --depth 1 https://github.com/BruhDudeWew/android_kernel_samsung_r0q.git /tmp/kang_repo

    - name: Setup KernelSU-Next + SUSFS
      run: |
        # Make Samsung's read-only files writable
        sudo chmod -R 777 kernel_platform/common/
        cd kernel_platform/common
        
        # 1. Install KernelSU-Next
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
        
        # 2. Clone simonpunk's SUSFS repo
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10
        
        # 3. Apply the specific GitLab commit you found!
        cd susfs4ksu
        curl -LSs "https://gitlab.com/simonpunk/susfs4ksu/-/commit/f4379db3b7913ecbaf304472577a2a535ef57b8d.diff" | patch -p1 || true
        cd ..
        
        # 4. Apply Core Kernel SUSFS Patch
        cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch ./
        patch -p1 --forward < 50_add_susfs_in_gki-android12-5.10.patch || true
        
        # ==========================================
        # THE AUTO-KANG SCRIPT (Core Kernel)
        # ==========================================
        echo "Checking for Hunk Failures in core kernel..."
        for rej in $(find . -name "*.rej"); do
          target="${rej%.rej}"
          clean_path="${target#./}"
          echo "[!] Hunk failed on $clean_path. Kanging fixed file from BruhDudeWew..."
          rm -f "$clean_path" "$rej"
          # Steal the perfectly working file from the cloned repo
          cp "/tmp/kang_repo/kernel_platform/common/$clean_path" "$clean_path"
        done
        
        # 5. Copy actual SUSFS Source Files
        cp susfs4ksu/kernel_patches/fs/* fs/
        cp susfs4ksu/kernel_patches/include/linux/* include/linux/
        
        # 6. Patch KernelSU-Next to use SUSFS
        cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU-Next/
        cd KernelSU-Next
        patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true
        
        # ==========================================
        # THE AUTO-KANG SCRIPT (KernelSU-Next)
        # ==========================================
        echo "Checking for Hunk Failures in KernelSU-Next..."
        for rej in $(find . -name "*.rej"); do
          target="${rej%.rej}"
          clean_path="${target#./}"
          echo "[!] KSU Patch failed on $clean_path. Kanging fixed KSU file..."
          rm -f "$clean_path" "$rej"
          cp "/tmp/kang_repo/kernel_platform/common/KernelSU-Next/$clean_path" "$clean_path" || true
        done

    - name: Lobotomize Samsung Security (Defex/RKP/Proca)
      run: |
        cd kernel_platform/common/arch/arm64/configs
        sudo chmod 777 gki_defconfig || true
        
        sed -i 's/CONFIG_SECURITY_DEFEX=y/CONFIG_SECURITY_DEFEX=n/g' gki_defconfig
        sed -i 's/CONFIG_RKP=y/CONFIG_RKP=n/g' gki_defconfig
        sed -i 's/CONFIG_PROCA=y/CONFIG_PROCA=n/g' gki_defconfig
        sed -i 's/CONFIG_KNOX_KAP=y/CONFIG_KNOX_KAP=n/g' gki_defconfig
        
        echo "CONFIG_KPROBES=y" >> gki_defconfig
        echo "CONFIG_HAVE_KPROBES=y" >> gki_defconfig
        echo "CONFIG_KPROBE_EVENTS=y" >> gki_defconfig

    - name: Build kernel
      run: |
        mkdir -p out/target/product/q4q/
        chmod +x build_kernel_GKI.sh || true
        bash build_kernel_GKI.sh

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: Samsung-Fold4-KSUNext-SUSFS-Image
        path: kernel_platform/out/msm-waipio-waipio-gki/dist/Image

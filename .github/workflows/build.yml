name: Build Fold4 Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev python3-pip unzip git patch

    - name: Download and Extract Samsung Source
      run: |
        pip install gdown
        gdown 1TjP4Sr-yJuZ4sZ69Fo1KWNh_sVn_jN2M -O samsung.zip
        unzip samsung.zip
        tar -xf Kernel.tar.gz

    - name: Setup KernelSU + SUSFS
      run: |
        sudo chmod -R 777 kernel_platform/common/
        cd kernel_platform/common
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
        wget -q https://api.github.com/repos/simonpunk/susfs4ksu/contents/kernel_patches/5.10 -O patches_list.json
        cat patches_list.json | python3 -c "import sys,json; [print(f['name']) for f in json.load(sys.stdin)]"

    - name: Build kernel
      run: |
        bash build_kernel_GKI.sh

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel-Image
        path: kernel_platform/out/msm-kernel-waipio/dist/Image
